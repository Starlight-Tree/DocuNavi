# 開発コンテナ（dev）の定義。devcontainer.json の dockerComposeFile が、../docker-compose.yml（api・frontend）に重ねて読む。
# ホストの `docker compose up`（ルートの docker-compose.yml だけ）には dev は含まれない。
#
# 相対パスは、最初のファイル（../docker-compose.yml）のあるリポジトリ直下が基準（このファイルの場所ではない）。
# 経緯と確認の状況は .devcontainer/README.md の「開発コンテナの構成（Compose）」。
services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    # Container Tools の一覧で見分けやすいように、自動の名前ではなく固定の名前にする。
    container_name: docunavi-devcontainer
    # Container Tools の一覧を役割別に並べる表示用のラベル（.vscode/settings.json の groupByLabel が読む）。動作には影響しない。
    labels:
      local.ui.group: "Devcontainers"
    # プロセスの後始末（ゾンビの回収）を init に任せる。
    init: true
    # コンテナを起こしておくだけ。VS Code が中に入る（devcontainer.json の overrideCommand の既定と同じ）。
    command: sleep infinity
    # scripts/dev-local.sh の画面（3000）を、ホストの 127.0.0.1 だけに公開する（2026-11-11）。VS Code の転送に依存しない。
    # BETTER_AUTH_URL・Google の redirect URI が http://localhost:3000 なので、番号は変えない。
    # 旧 Compose の frontend（../docker-compose.yml の 3000:3000）と同時には起動できない（runServices で dev だけにしてある）。
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspaces/docunavi:cached
      # コンテナを再ビルドしても Claude Code の履歴・認証情報が消えないよう、~/.claude を名前付きボリュームに永続化する。
      # gh の設定（トークンを含む）も、読み取り専用の細粒度トークンだけを置く前提で、同じく永続化する
      # （README の「開発環境の GitHub CLI（gh）」）。
      # gcloud のログイン情報（~/.config/gcloud。リフレッシュトークンを含む）も、2026-10-21 から同じく名前付きボリュームに残す。
      # 再ビルドのたびに手動でログインし直さずに、MCP の headersHelper（scripts/mcp-auth-header.sh）がつながるようにするため。
      # 長期の資格情報が保存されるリスクを受け入れた変更。失効や組織のポリシー等で、再ログインが要ることはある。
      # 消し方は .devcontainer/README.md の「ログアウト」。
      - claude-config:/home/vscode/.claude
      - gh-config:/home/vscode/.gh-config
      - gcloud-config:/home/vscode/.config/gcloud
      # ~/.infisical は Infisical CLI の状態と、マシンアイデンティティの資格情報（ユーザーが置く。client secret は平文・権限 600。Viewer 固定）。
      # 再ビルドで消えないよう、名前付きボリュームに残す（ユーザーが決定、2026-11-02）。イメージ・Git には含めない。
      # 消し方と再設定は .devcontainer/README.md の「開発環境の Infisical」。
      - infisical-config:/home/vscode/.infisical
      - playwright-browsers:/home/vscode/.cache/ms-playwright
      # Project Manager の projects.json（docunavi と jobnavi で共有。資格情報は入れない）。
      - shared-project-manager:/home/vscode/.project-manager
    # devcontainer.json の containerEnv と同じ値（Compose ベースで containerEnv が効くかは未確認なので、両方に置く。変えるときは両方を直す）。
    # GH_CONFIG_DIR: ~/.config/gh ではなく専用の場所にする。~/.config がイメージに無いと、マウントの親ディレクトリが
    # root 所有で作られ、他のツールが ~/.config に書けなくなるため。gcloud は、ガードのフックと拒否ルールが
    # ~/.config/gcloud を守っているので、場所を変えずにマウントし、親の所有者は postCreateCommand の gcloud-volume で直す。
    # TZ: date やログの時刻を JST にする（開発コンテナだけ）。
    # CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: gcloud の日常の ID を、閲覧専用の docunavi-viewer へのなりすましに固定する。
    # 手順は .devcontainer/README.md。
    # CLAUDE_CONFIG_DIR: Claude Code の設定ファイル（.claude.json。ローカル登録の MCP を含む）を ~/.claude のボリューム側に置く。
    # DOCKER_HOST: 読み取り専用のプロキシ。docunavi-dev の中でだけ引ける名前。
    environment:
      GH_CONFIG_DIR: /home/vscode/.gh-config
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      TZ: Asia/Tokyo
      DOCKER_HOST: tcp://docunavi-docker-proxy:2375
      CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: docunavi-viewer@docunavi-ops.iam.gserviceaccount.com
      # Infisical CLI のテレメトリー（PostHog）と更新確認を止める（2026-11-02）。
      INFISICAL_DISABLE_TELEMETRY: "true"
      INFISICAL_DISABLE_UPDATE_CHECK: "true"
    # docunavi-dev だけに繋ぐ（docker-proxy との通信用。外へも出られる）。frontend-net・backend-net には繋がない
    # （api に、開発コンテナから直接届かないようにするため）。
    networks:
      - dev-net

  # 実キーの .env でも D1_API_URL が無いと、api は起動の検査に失敗し、unhealthy のまま止まる（uvicorn --reload なので、コンテナは落ちない）。
  # service_healthy のままだと、`docker compose up -d` が frontend の待ちで失敗し、開発コンテナの作成が止まる。
  # 開発コンテナ経由の起動だけ、api が「起動した」ところまでで進める（ホストの `docker compose up` は service_healthy のまま）。
  frontend:
    depends_on:
      api:
        condition: service_started

networks:
  # .devcontainer/docker-proxy/compose.yml が作る（devcontainer.json の initializeCommand が先に起動する）。
  dev-net:
    name: docunavi-dev
    external: true

volumes:
  # 既存のボリュームの名前をそのまま使う（旧: devcontainer.json の mounts の ${devcontainerId}。2026-10-22 に /proc/self/mountinfo で確認）。
  # 名前を変えると、Claude Code の履歴・gcloud のログイン・gh のトークン・pgpass が空のボリュームに替わる。
  # 別のマシンでは、この名前のボリュームが無ければ新しく作られる（空）。
  claude-config:
    name: claude-code-config-166oi5198v23umj7mu1l48p8d00au5920c8hog97rp6gbuvfuoe4
  gh-config:
    name: gh-config-166oi5198v23umj7mu1l48p8d00au5920c8hog97rp6gbuvfuoe4
  gcloud-config:
    name: gcloud-config-166oi5198v23umj7mu1l48p8d00au5920c8hog97rp6gbuvfuoe4
  # 新規（2026-11-02）。同じ命名の規則で、空のボリュームとして作られる（資格情報は、ユーザーが端末で置く）。
  infisical-config:
    name: infisical-config-166oi5198v23umj7mu1l48p8d00au5920c8hog97rp6gbuvfuoe4
  playwright-browsers:
    name: playwright-browsers-166oi5198v23umj7mu1l48p8d00au5920c8hog97rp6gbuvfuoe4
  # 新規。docunavi と jobnavi の両方が、同じ名前で参照する（Project Manager の projects.json だけ）。
  # external: ホストで 1 回 `docker volume create devcontainer-shared-project-manager` を実行してから起動する（無いと起動に失敗する）。
  shared-project-manager:
    name: devcontainer-shared-project-manager
    external: true
