# `deploy/*` のタグを push したときだけ動く Cloud Build のトリガー用。ビルドして、本番のトラフィックを変えずに（0%）タグ付きで配備する。
# 手順と権限は docs/deploy.md の「タグ push で 0% 配備する（Cloud Build トリガー）」。
#
# 守ること（変えるときは docs/deploy.md を直す）:
#   - 配備は必ず --no-traffic。100% への切り替え（promote）はしない。ユーザーが ./scripts/preview.sh promote で行う
#   - --set-env-vars / --set-secrets / --use-http2 は付けない（付けると、いまの設定や有料キーの Secret が変わる・消える）。
#     設定はサービスの最新の設定を引き継ぐ
#   - タグ名は、その日の 1 回目が deploy/vYYYYMMDD、2 回目以降が deploy/vYYYYMMDD-N（N は 2 から。-1・-0・先頭ゼロは不可）。
#     日付は JST の実在する日で未来でない。使ったタグ・番号は再利用しない。
#     先頭の deploy/ を外した名前が Cloud Run のタグ名になる（deploy/v20261117 → タグ v20261117、deploy/v20261117-2 → タグ v20261117-2）。
#     2026-11-17 より前の旧形式（deploy/py314-1116 など）は、検査で止める
#   - 最後の prune-old-revisions は、配備の後始末だけ。新しい順に 3 つと、トラフィックが向いている・タグが付いたリビジョンは消さない。
#     失敗しても配備の結果は変えない。KEEP を減らす・保護の条件を外す変更は、戻し先を消す恐れがあるので、事前に確認する
#
# 置換変数: ユーザー定義（_ で始まる）は下の既定のままでよく、トリガーで渡すものは無い。画面は Cloudflare の Worker `docunavi-web`（frontend）が配信するので、
# このイメージは API だけ（ビルド引数は無い）。
# 組み込み: PROJECT_ID、SHORT_SHA、TAG_NAME（タグの push で起動したときに入る）
substitutions:
  _SERVICE: docunavi
  _REGION: asia-northeast1
  _AR_REPO: cloud-run-source-deploy

steps:
  # タグの形を確かめ、Cloud Run のタグ名を /workspace/run-tag に控える。形が違えば、ビルドの前に止める
  - id: check-tag
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    # 置換変数はシェルの環境変数にならないので、env で渡す（渡さないと $${TAG_NAME} が空になる。2026-11-14 の初回で失敗）
    env:
      - TAG_NAME=${TAG_NAME}
    args:
      - -c
      - |
        set -euo pipefail
        re='^deploy/v([0-9]{8})(-([2-9]|[1-9][0-9]+))?$$'
        if [[ ! "$${TAG_NAME:-}" =~ $$re ]]; then
          echo "タグ名は deploy/vYYYYMMDD（その日の 2 回目以降は deploy/vYYYYMMDD-N。N は 2 から、先頭ゼロなし）にしてください（日付は JST）: '$${TAG_NAME:-}'" >&2
          exit 1
        fi
        d="$${BASH_REMATCH[1]}"
        if [[ "$$(date -u -d "$${d:0:4}-$${d:4:2}-$${d:6:2}" +%Y%m%d 2>/dev/null)" != "$$d" ]]; then
          echo "日付が実在しません: $$d" >&2
          exit 1
        fi
        # JST の今日。イメージに tzdata があるとは限らないので、UTC に 9 時間足して求める
        today="$$(date -u -d '+9 hours' +%Y%m%d)"
        if [[ "$$d" > "$$today" ]]; then
          echo "日付が未来です（JST の今日は $$today）: $$d" >&2
          exit 1
        fi
        printf '%s' "$${TAG_NAME#deploy/}" > /workspace/run-tag
        echo "Cloud Run のタグ: $$(cat /workspace/run-tag)"

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}
      - .

  # 配備の前にイメージが Artifact Registry に無いといけないので、`images:` ではなくここで push する
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}

  - id: deploy-no-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy "${_SERVICE}" --project "${PROJECT_ID}" --region "${_REGION}" \
          --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}" \
          --no-traffic --tag "$$(cat /workspace/run-tag)"
        echo "--- 配備後のトラフィック（新しいリビジョンが 0%、本番が 100% のままであること）"
        gcloud run services describe "${_SERVICE}" --project "${PROJECT_ID}" --region "${_REGION}" \
          --format='yaml(status.traffic)'

  # 古いリビジョンの掃除。配備が成功したあとの後始末なので、失敗しても配備の結果は変えない（警告を出すだけ）。
  # 残すもの: 新しい順に 3 つ（本番・戻し先 2 つ）、トラフィックが向いている・タグが付いているリビジョン。つまり、タグが付いたものは消さない
  - id: prune-old-revisions
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail
        KEEP=3
        protected="$$(gcloud run services describe "${_SERVICE}" --project "${PROJECT_ID}" --region "${_REGION}" \
          --format='value(status.traffic[].revisionName)' | tr ';' '\n')"
        n=0
        for rev in $$(gcloud run revisions list --service "${_SERVICE}" --project "${PROJECT_ID}" --region "${_REGION}" \
            --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)'); do
          n=$$((n + 1))
          [ "$$n" -le "$$KEEP" ] && continue
          if printf '%s\n' "$$protected" | grep -qx "$$rev"; then
            echo "残す（トラフィックまたはタグあり）: $$rev"
            continue
          fi
          echo "消す: $$rev"
          gcloud run revisions delete "$$rev" --project "${PROJECT_ID}" --region "${_REGION}" --quiet \
            || echo "警告: $$rev を消せませんでした（配備は成功しています）" >&2
        done
        exit 0

options:
  logging: CLOUD_LOGGING_ONLY
