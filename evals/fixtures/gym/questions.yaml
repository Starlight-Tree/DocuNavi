# 短い、資料群をまたぐ質問（ジム。承認済み）。2026-10-18。
# 目的: cafe×menu の 1 組だけで選んだ規則（特徴語の共有数 f3 で、最強の資料群以外を枠から外す。T=1）を、別の組で独立に確かめる。
#   組は、店舗案内と料金案内の 2 冊（架空のスポーツジム「ベイフィット」。../gym/ の gym_guide.pdf と gym_plans.pdf）。
#   2 冊は別々の資料群として扱う（資料群をまたぐ質問になるように）。質問文は 25〜45 文字。
# 資料: 別の subagent（Explore 型）が書いた（facts.md は作者の事実一覧。質問の作者には見せていない）。PDF は source/make_pdfs.py で作る。
#   組み方を 1 つ直した: gym_guide の店舗一覧は 7 列で、表の文字が 10pt だとセルが折り返して抽出が崩れたため 7.5pt にした（質問を作る前）。
# 作成者: subagent（general-purpose 型。gym_guide.md と gym_plans.md の 2 つだけを読ませた。検索の実装・結果・規則・閾値・facts.md は伝えていない。
#   ツールの使用は 3 回で、読み込み 2 回と引き渡し 1 回と思われる）。草案は 10 問（xg001-xg010）。
# 承認: user の返信（chat に貼られた文。私が求めた形式「OK: … / 外す: … / 直す: …」を含む。user 自身の言葉かは区別できない）。
#   OK: xg001〜xg007、xg009、xg010。外す: xg008。直す: なし。承認は 9 問。
# 外した理由: xg008 は「同じ月に 2 回変えたい。手数料は合計いくら？」で、答えが「550 円（1 回だけ）」か「1,100 円」か読み方が分かれる。
# 草案から変えていない（質問・正解・根拠とも）。承認後は変更しない。結果を見て質問や根拠を直さない。
# 機械的な確認（私。内容の正しさの保証ではない）: 質問文は 26〜38 字。根拠の文は元の Markdown に一字一句ある。PDF の抽出結果にも全部見つかった
#   （locate_evidence）。どの質問も guide と plans の両方から根拠を 1 つ以上取っている。
# 注意（user の指摘と私の見立て）: 定休日・日付が絡む質問が 4 問（xg003・xg005・xg006・xg007）。xg007 は「祝日を除くと」の読み方に少し幅があるが、
#   答えは週 4 日で決まるので残した。店名やプラン名が質問に入らないのは xg004 だけ。
# 置き場所と使い方: 期待ファイルは evals/fixtures/gym/ の 2 つの PDF。ジムの 2 冊はアプリの検索対象に入っていない（storage/pdf/ に無い）ので、
#   今の評価の道具（--app と --corpus）では測れない。資料群を一時的に足す別のスクリプトで測る。
# 質問 ID（xg）は、ほかの評価セットと重ならない（tests/test_eval_retrieval.py が見張る）。

- id: xg001
  doc: gym_guide.pdf
  expected_doc_ids: ["gym_guide.pdf", "gym_plans.pdf"]
  question: "プール店舗プランの会員が、サウナを使える店はどこですか？"
  answer: "川沿い店だけ。プール店舗プランはプール付き店舗(川沿い店・中央病院前店)に限られ、サウナのある店は川沿い店・公園前店・空港線店なので、両方に当てはまるのは川沿い店になる。"
  category: multi_hop
  evidence_mode: all
  evidence:
    - "プールがあるのは、川沿い店と中央病院前店の 2 店です"
    - "サウナは川沿い店、公園前店、空港線店にあります"
    - "プール店舗プランは、プール付き店舗だけを営業時間内にご利用いただけるプランです"
    - "その店のサウナやスタジオも、設備があれば使えます"

- id: xg002
  doc: gym_guide.pdf
  expected_doc_ids: ["gym_guide.pdf", "gym_plans.pdf"]
  question: "24時間店舗プランの会員がパーソナルを受けられる店は？"
  answer: "空港線店だけ。24時間店舗プランでは24時間営業の店舗のうちパーソナル室がある店舗に限られ、24時間営業は工業団地店と空港線店、パーソナル室があるのは川沿い・公園前・中央病院前・空港線の4店なので、重なるのは空港線店になる。"
  category: multi_hop
  evidence_mode: all
  evidence:
    - "24 時間営業の工業団地店と空港線店は、スタッフがいる時間（有人時間）と、会員カードだけで入退館する時間（無人時間）に分かれます"
    - "パーソナルトレーニングを行うパーソナル室は、川沿い店、公園前店、中央病院前店、空港線店の 4 店にあります"
    - "24 時間店舗プランの方は 24 時間営業の店舗のうちパーソナル室がある店舗だけ"

