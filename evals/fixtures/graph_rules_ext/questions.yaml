# GraphRAG の効果を、遠い参照（ref_far）と 3 条またぎ（chain3）を増やして測り直すための質問（草案。user の承認前）。2026-11-01。
# 作成者: Claude（検索の結果を見る前に書いた。この資料・質問の埋め込みは、まだ作っていない）。
# 既存の評価セット（fixtures/graph_rules の gr001-gr022 と、その結果）には触れない。別の資料・別の質問で、別の計画・キャッシュ・結果に書く。
#
# なぜ資料も新しいか:
#   既存の資料（工房・ラウンジ、辺 10 本）は、ref_far が 4 問、chain3 が 1 問で、辺の組み合わせをほぼ使い切っている。
#   同じ辺に言い換えの質問を足しても、独立した標本にならない。そこで、辺の組み合わせが別の資料を 4 つ足した。
# 資料: 市民プール・市立図書館・市民会館ホール・市民農園の利用規程（各 17〜18 条、計 69 条）。1 条 = 1 チャンクで取り込む（scripts/eval_graph.py --set graph_rules_ext）。
#   条の番号が 4 つの資料で重なる（第1条〜第17条）。別の資料の同じ番号に辺を張らないことも確かめる。
# 質問の数（62 問）: ref_far 20 / chain3 14 / ref_near 4 / ref_unneeded 8 / single 8 / absent 8。
#   既存の評価セットは ref_far 4 / chain3 1 / ref_near 5 / ref_unneeded 3 / single 5 / absent 4。
# kind（質問を書いたときの見立て。結果を見て付け替えない）:
#   ref_far      参照元の条を引く質問。答えの後半は、参照先の条にだけあり、質問に参照先の条の見出しの語（題を「の」で分けた語）を含めない
#                （tests/test_eval_graph.py が、この規則を機械で確かめる）。
#   ref_near     同じだが、質問の語が参照先の条にも近い（料金と減免など。参照先がベクトルでも上位に来うる）
#   chain3       3 つの条（A -> B -> C）にまたがる。質問は A の話題で、答えの決め手は C。GraphRAG は 1 段（参照先を 1 件）しか足さない。
#                質問に C の見出しの語を含めない（ref_far と同じ規則）。A から C へ直接の辺は無い（テストが確かめる）
#   ref_unneeded 参照元の条だけで答えが決まる。辺は出るが、追加の文脈は要らない（余計な文脈の影響＝誤追加を見る）
#   single       辺のない条だけで決まる
#   absent       資料に答えが無い（追加の文脈が付くか＝誤追加を見る）
# 採点: ref_far / ref_near / chain3 は evidence_mode: all（参照元と参照先の両方の文が、返ったチャンクに要る。chain3 は 3 つの条すべて）。
#   本体の上位 k 件だけで満たすか（hit_main）と、GraphRAG の追加を含めて満たすか（hit_with_graph）を分けて数える。
# 辺の共有（独立でない部分。報告に書く）: ref_far の参照元は 20 条すべて別。chain3 の始点 A は 14 条すべて別だが、中間 B は 4 資料で
#   計 8 条（プール 8・9、図書館 9・12、ホール 12・13、農園 12・13）を共有し、終点 C も複数の質問で共有する（質問ごとに別の文を根拠にする）。
# 質問 ID の接頭辞は gx（evals/CLAUDE.md の表）。承認後は、質問・根拠・資料を変えない。

