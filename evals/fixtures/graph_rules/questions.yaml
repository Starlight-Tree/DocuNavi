# GraphRAG の効果を測るための質問（草案。user の承認前）。2026-11-01。
# 作成者: Claude（検索の結果を見る前に書いた。実 API の埋め込みも、まだ作っていない）。
# 資料: 工房利用規程.txt（12 条）、ラウンジ利用規程.txt（10 条）。1 条 = 1 チャンクで取り込む（scripts/eval_graph.py）。
#   条の番号が両方の資料で重なる（第7条・第8条ほか）。別の資料の同じ番号に辺を張らないことも確かめる。
# kind（質問を書いたときの見立て。結果を見て付け替えない）:
#   ref_far      参照元の条を引く質問。答えの後半は、参照先の条にだけあり、質問の語は参照先と離れている
#   ref_near     同じだが、質問の語が参照先の条にも近い（参照先がベクトルでも上位に来うる）
#   chain3       3 つの条（A -> B -> C）にまたがる。GraphRAG は 1 段（参照先を 1 件）しか足さない
#   ref_unneeded 参照元の条だけで答えが決まる。辺は出るが、追加の文脈は要らない（余計な文脈の影響を見る）
#   single       辺のない条だけで決まる
#   absent       資料に答えが無い（追加の文脈が付くかを見る）
# 採点: ref_far / ref_near / chain3 は evidence_mode: all（参照元と参照先の両方の文が、返ったチャンクに要る）。
#   本体の上位 k 件だけで満たすか（hit_main）と、GraphRAG の追加を含めて満たすか（hit_with_graph）を分けて数える。
# 質問 ID の接頭辞は gr（evals/CLAUDE.md の表）。承認後は、質問・根拠を変えない。
- id: gr001
  question: "電動のこぎりを使えるようになるには、事前に何をしておく必要がありますか。それにはいくらかかりますか。"
  answer: "第8条の講習を修了しておく必要があります。受講料は1,500円です。"
  category: multi_hop
  kind: ref_far
  expected_doc_ids: ["工房利用規程.txt"]
  evidence_mode: all
  evidence:
    - "特定機器を使用する者は、第8条に定める講習を修了していなければならない"
    - "受講料は1,500円"

