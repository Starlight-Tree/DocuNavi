    style: ご案内の文体（です・ます）。表を使ってよい。
  - id: tuition
    doc_type: manual
    title: "{label} 学費・給食費等のご案内"
    tags: [fee]
    variants: [全体]
    chars: [4500, 7500]
    outline: [このご案内について, 費用の種類, 納め方, 減免と支援, 返金]
    style: ご案内の文体（です・ます）。費用は表で示してよい。
  - id: school-life
    doc_type: manual
    title: "{label} 学校生活のしおり"
    tags: [life]
    variants: [全体]
    chars: [4500, 7500]
    outline: [このしおりについて, 一日の流れ, 持ち物と服装, 行事と年間の予定, ご家庭へのお願い]
    style: しおりの文体（です・ます）。
  - id: safety
    doc_type: manual
    title: "{label} 安全・防災のしおり"
    tags: [safety]
    variants: [全体]
    chars: [4500, 7500]
    outline: [このしおりについて, 避難訓練, 空気を整える設備, けがや病気のとき, 災害や緊急のときの連絡]
    style: しおりの文体（です・ます）。手順は番号を付けて 1 文ずつ。
