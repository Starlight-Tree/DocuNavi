# オアシス高等学校（架空。アルカ市の高校。普通科と発着場技術科）の共通設定。2026-11-19 に新しく作った。
# 事実（facts）にある数値・日付・時刻だけが、生成した本文に出てよい。足す・直すと version が変わる。
target: oasis-high
label: オアシス高等学校
classify_as: school  # 画面の「対象」は、学校 1 つにまとめる（識別名はそのまま。PDF の置き場所・台帳に使う）
existing_documents: 0
documents: 5
revision: 2026年11月1日改訂
premise: アルカ市にあるオアシス高等学校（1年生から3年生。普通科と発着場技術科）。生徒と保護者に向けた、学則・入学案内・学費・学校生活・安全の資料。問い合わせ先は、学校の事務室。
contacts: []
forbidden: [東京大学, 早稲田, 慶應, 京都大学, 文部科学省, ザーハリアン]
extra_numbers: []

facts:
  - {id: world-city, tags: [core], text: "この学校は、アルカ市にある。アルカ市は、居住区・発着場・岩山・遺跡の 4 つのエリアに分かれている。"}
  - {id: world-air, tags: [core], text: "この星の厳しい環境に合わせて、校舎のすべての部屋に、空気を整える設備を備えている。校舎の中では、マスクなしで過ごせる。"}
  - {id: world-chain, tags: [core], text: "ほしぞら幼稚園、アルカ第一小学校、アルカ中央中学校、オアシス高等学校、ザーハード大学は、アルカ市の学校の並びで、進学の道がつながっている。"}
  - {id: overview, tags: [core], text: "オアシス高等学校は、アルカ市の高校で、1年生から3年生までの3学年がある。学科は、普通科と発着場技術科の2つ。"}
  - {id: capacity, tags: [core, admit], text: "1学年の定員は、普通科が160名、発着場技術科が80名。全校の定員は、720名。"}
  - {id: location, tags: [core, life], text: "校舎は、居住区エリアの北側にある。発着場技術科の実習は、発着場エリアにある実習場で行う。"}
  - {id: office-hours, tags: [core], text: "学校の事務室の受付時間は、月曜日から金曜日の午前8時30分から午後5時まで。土曜日、日曜日、祝日はお休み。"}
  - {id: origin, tags: [core], text: "校名の「オアシス」は、アルカ市のカフェ「オアシス珈琲」と同じ考えに由来する。その考えは、「砂漠のオアシスのように、人が集まる場所をつくる」というもの。"}

  - {id: school-year, tags: [rules], text: "学年は、4月に始まり、翌年の3月に終わる。1年を3つの学期に分ける。"}
  - {id: gate-hours, tags: [rules, safety], text: "校門は、午前7時30分に開き、午後6時に閉まる。閉まったあとは、校内に残れない。"}
  - {id: attendance, tags: [rules], text: "始業は午前8時45分。これに遅れて登校すると、遅刻とする。始業から1時間以上遅れたときは、欠席とする。"}
  - {id: absence-notice, tags: [rules], text: "欠席や遅刻をするときは、保護者が、午前8時40分までに、事務室へ連絡する。連絡がないまま欠席したときは、学校から保護者に確認する。"}
  - {id: absence-limit, tags: [rules], text: "1つの科目で、授業の3分の1以上を欠席すると、その科目の単位は認められない。病気や災害による欠席は、届け出があれば、この数に入れない。"}
  - {id: credits, tags: [rules], text: "卒業に必要な単位は、74単位。普通科も、発着場技術科も同じ。"}
  - {id: tech-credits, tags: [rules], text: "発着場技術科は、卒業に必要な単位のうち、専門科目の実習で18単位以上を修める。実習は、発着場エリアの実習場で行う。"}
  - {id: promotion, tags: [rules], text: "進級は、修得した単位の合計が、2年生に上がるとき22単位以上、3年生に上がるとき46単位以上であることを条件とする。"}
  - {id: grading, tags: [rules], text: "成績は、科目ごとに100点満点で評価する。60点未満の科目は、単位を認めない。定期考査は、学期ごとに1回行う。"}
  - {id: makeup-exam, tags: [rules], text: "単位を認められなかった科目は、追試験を1回だけ受けられる。追試験の合格点は、本試験と同じ。"}
  - {id: dress, tags: [rules, life], text: "校内では、学校が定めた制服を着る。校舎の中では、上履きを使う。"}
  - {id: phone, tags: [rules], text: "携帯端末は、授業中に使わない。休み時間と昼休みは、使ってよい。"}
  - {id: guidance-steps, tags: [rules], text: "生徒への指導は、注意、保護者への連絡、校長との面談の順に進める。"}
  - {id: suspension, tags: [rules], text: "ほかの生徒に危害を加えたときは、校長が、登校を止めることができる。止める期間は、7日以内とする。"}
  - {id: not-documented, tags: [rules, fee], text: "制服の価格、定期考査の順位の公表、卒業生の進学率の目標は、定められていない。"}

  - {id: ad-recommend-apply, tags: [admit], text: "推薦入試の出願は、12月14日から12月18日まで。事務室で受け付ける。"}
  - {id: ad-recommend-exam, tags: [admit], text: "推薦入試は、1月12日に、面接だけで行う。募集は、普通科が48名、発着場技術科が24名。合格発表は、1月15日の午前10時。"}
  - {id: ad-apply, tags: [admit], text: "一般入試の出願は、1月20日から1月26日まで。事務室で受け付ける。"}
  - {id: ad-exam-date, tags: [admit], text: "一般入試の学力検査は、2月6日の午前9時に始まる。受験生は、午前8時30分までに集合する。"}
  - {id: ad-subjects, tags: [admit], text: "学力検査は、国語、数学、英語、理科、社会の5科目。時間は各科目45分、配点は各科目100点。"}
  - {id: ad-tech-interview, tags: [admit], text: "発着場技術科を受ける人は、学力検査のあと、面接を受ける。面接は、1人15分。普通科は、面接を行わない。"}
  - {id: ad-second-exam, tags: [admit], text: "病気などで学力検査を受けられなかった人は、2月8日の追検査を受けられる。追検査を受けるには、検査の当日までに、事務室へ届け出る。"}
  - {id: ad-announce, tags: [admit], text: "一般入試の合格発表は、2月12日の午前10時。事務室の前の掲示と、受験票の番号で確かめる。電話での問い合わせには答えない。"}
  - {id: ad-procedure, tags: [admit], text: "合格した人の入学手続は、2月15日から2月19日の午前9時から午後4時まで。事務室で行う。期間内に手続をしないと、入学を辞退したものとみなす。"}
  - {id: ad-documents, tags: [admit], text: "出願に必要な書類は、入学願書、中学校の調査書、写真1枚。写真は、縦4cm、横3cmで、3か月以内に撮ったもの。"}
  - {id: ad-eligibility, tags: [admit], text: "受験できるのは、アルカ市内の中学校を卒業する見込みの人。アルカ中央中学校の生徒に限らない。"}
  - {id: ad-class-size, tags: [admit], text: "1クラスの人数は、40名。普通科は1学年4クラス、発着場技術科は1学年2クラス。"}
  - {id: ad-ceremony, tags: [admit, life], text: "入学式は、4月7日の午前10時に、体育館で行う。保護者は、1家庭2名まで出席できる。"}
  - {id: ad-briefing, tags: [admit], text: "入学前の説明会は、3月19日の午後2時に行う。入学前の課題は、この説明会で渡す。"}

  - {id: fee-entrance, tags: [fee], text: "入学金は、60,000円。入学手続のときに、1回だけ納める。"}
  - {id: fee-tuition, tags: [fee], text: "授業料は、月額9,800円。普通科も、発着場技術科も同じ。"}
  - {id: fee-facility, tags: [fee], text: "施設費は、年額24,000円。校舎の空気を整える設備や、図書室、体育館の維持に使う。"}
  - {id: fee-practice, tags: [fee], text: "発着場技術科の実習費は、年額36,000円。実習で使う材料と、保護具の費用にあてる。"}
  - {id: fee-textbook, tags: [fee], text: "教科書と教材の代金は、1年生が約31,000円。2年生と3年生の金額は、定められていない。"}
  - {id: fee-saving, tags: [fee], text: "校外学習の積立金は、月額4,500円。遠足、校外学習、宿泊研修の費用にあてる。"}
  - {id: fee-club, tags: [fee], text: "部費は、月額1,000円。部活動に入った生徒だけが納める。"}
  - {id: fee-lunch, tags: [fee, life], text: "食堂の昼食は、1食480円。前の日の午後3時までに、食券を買って申し込む。"}
  - {id: fee-exam, tags: [fee, admit], text: "受験料は、推薦入試も一般入試も、2,200円。出願のときに納める。"}
  - {id: fee-retest, tags: [fee, rules], text: "追試験の手数料は、1科目につき500円。受けるときに、事務室で納める。"}
  - {id: fee-payment, tags: [fee], text: "授業料、積立金、部費は、毎月25日に、保護者が登録した口座から引き落とす。入学金と施設費の納め方は、入学手続のときに案内する。"}
  - {id: fee-overdue, tags: [fee], text: "2か月続けて納付がないときは、事務室から保護者に連絡する。納付の相談は、事務室で受け付ける。"}
  - {id: fee-reduction, tags: [fee], text: "世帯の収入が基準を下回る場合は、授業料が半額になる。申請は、4月30日までに、事務室に出す。"}
  - {id: fee-scholarship, tags: [fee], text: "成績の優れた生徒には、給付の奨学金がある。金額は年額120,000円で、各学年10名に給付する。"}
  - {id: fee-refund, tags: [fee], text: "入学手続のあとに入学を辞退したときは、入学金は返金しない。ほかの納付金は、全額を返金する。"}
  - {id: fee-leave-refund, tags: [fee], text: "年度の途中で退学したときは、退学した月の翌月から先の授業料を返金する。積立金は、使った分を引いて返金する。"}
  - {id: fee-transport, tags: [fee, life], text: "乗り合い便の運賃は、学校の納付金に含まれない。運賃は、生徒の家庭が負担する。"}

  - {id: life-class, tags: [life], text: "授業は、1コマ50分で、1日に6コマ。コマのあいだの休み時間は、10分。"}
  - {id: life-lunch, tags: [life], text: "昼休みは、午後12時35分から午後1時20分までの45分間。昼食は、お弁当を持ってくるか、食堂で食べる。"}
  - {id: life-closing, tags: [life], text: "終礼は、午後3時20分に行う。そのあと、教室の清掃をする。"}
  - {id: life-club-hours, tags: [life], text: "部活動は、放課後の午後3時50分から午後5時20分まで。この時刻を過ぎて、校内に残らない。"}
  - {id: life-clubs, tags: [life], text: "部活動は、運動部が6つ、文化部が5つある。運動部は、陸上部、水泳部、バスケットボール部、卓球部、弓道部、浮上レース部。文化部は、吹奏楽部、美術部、科学部、料理部、放送部。"}
  - {id: life-club-join, tags: [life], text: "部活動は、1人1つまで入れる。入部は、4月15日までに、顧問の先生に届け出る。"}
  - {id: life-items, tags: [life], text: "毎日の持ち物は、教科書、筆記用具、上履き、水筒、携帯端末の充電器。実習のある日は、実習用の作業着も持ってくる。"}
  - {id: life-uniform-season, tags: [life], text: "制服は、夏服と冬服がある。衣替えは、6月1日と10月1日に行う。体育の授業では、学校指定の体育着を着る。"}
  - {id: life-transport, tags: [life], text: "登下校は、徒歩か、発着場の乗り合い便で行う。乗り合い便の停留所は、校門の前にある。"}
  - {id: life-terms, tags: [life], text: "第1学期は4月1日から7月20日まで、第2学期は9月1日から12月22日まで、第3学期は1月8日から3月31日まで。夏休みは7月21日から8月31日まで、冬休みは12月23日から1月7日まで。"}
  - {id: life-sports-day, tags: [life], text: "体育祭は、5月29日に、校庭で行う。雨のときは、翌週に延ばす。"}
  - {id: life-festival, tags: [life], text: "文化祭「オアシス祭」は、10月23日と10月24日に行う。24日は、ご家族や地域の方も見学できる。"}
  - {id: life-excursion, tags: [life], text: "1年生の遠足は、5月14日に、遺跡エリアで行う。遺跡エリアでは、案内の方の説明を聞きながら歩く。"}
  - {id: life-field-trip, tags: [life], text: "2年生の校外学習は、9月17日に、岩山エリアで行う。岩山エリアでは、地層や岩の観察をする。"}
  - {id: life-stay, tags: [life], text: "宿泊研修は、1年生が7月3日から7月4日までの1泊2日で、発着場エリアの宿泊施設で行う。"}

  - {id: sf-drill, tags: [safety], text: "避難訓練は、年に3回、5月、9月、1月に行う。1回の訓練で、全校の生徒が校庭へ集まるまでの時間を測る。"}
  - {id: sf-assembly, tags: [safety], text: "避難のときの集合場所は、校庭の北側。クラスごとに並び、担任の先生が人数を確かめる。"}
  - {id: sf-air-check, tags: [safety], text: "空気を整える設備は、年に2回、夏休みと冬休みの期間に点検する。点検の期間中は、立ち入りが制限される部屋がある。"}
  - {id: sf-air-alarm, tags: [safety], text: "空気を整える設備に異常があると、教室の表示灯が赤くなる。そのときは、先生の指示に従って、別の部屋へ移る。"}
  - {id: sf-outdoor, tags: [safety], text: "校舎の外へ出る授業や行事では、必要な備えを、教員が事前に配る。生徒は、教員の指示があるまで、備えを外さない。"}
  - {id: sf-nurse, tags: [safety], text: "保健室は、午前7時45分から午後5時30分まで開いている。具合が悪いときは、まず担任の先生に伝えて、保健室へ行く。"}
  - {id: sf-injury, tags: [safety], text: "保健室で対応できないけがや病気のときは、保護者に連絡し、居住区エリアの医療所へ運ぶ。付き添いは、教員が行う。"}
  - {id: sf-aed, tags: [safety], text: "AEDは、体育館、保健室、事務室に置いてある。使い方の講習は、1年生の6月に行う。"}
  - {id: sf-contact, tags: [safety], text: "学校からの緊急の連絡は、保護者が登録した連絡先に、一斉に配信する。連絡先が変わったときは、すぐに事務室へ届け出る。"}
  - {id: sf-pickup, tags: [safety], text: "災害や停電、設備の故障のときは、生徒を教室にとどめ、保護者に引き取りに来てもらう。引き取りの訓練は、11月に年1回行う。"}
  - {id: sf-stock, tags: [safety], text: "水と食料は、全校の生徒の3日分を、校舎に備えている。備蓄の点検は、4月に行う。"}
  - {id: sf-shuttle, tags: [safety, life], text: "乗り合い便が止まったときは、生徒は校舎で待つ。事務室が、保護者に連絡して、帰宅の方法を決める。"}
  - {id: sf-practice, tags: [safety], text: "実習場では、保護帽と安全靴を着ける。着けていない生徒は、実習に入れない。"}
  - {id: sf-practice-staff, tags: [safety], text: "実習は、教員が2名以上ついて行う。機械を動かすときは、教員の合図を待つ。"}
  - {id: sf-counsel, tags: [safety], text: "いじめや悩みの相談は、相談室で受ける。相談室は、保健室の隣にある。相談した内容は、本人の同意なしに他の人に伝えない。"}

kinds:
  - id: gakusoku
    doc_type: regulation
    title: "{label} 学則"
    tags: [rules]
    variants: [全体]
    chars: [4500, 7500]
    outline: [目的, 定義, 修業と学年, 登校と出欠, 生徒への指導, 附則]
    style: 規定の文体。「第N条」で条を立て、である調。連絡先の電話番号は書かない。枝番の条（第N条の2）は使わない。
  - id: admission
    doc_type: manual
    title: "{label} 入学案内"
    tags: [admit]
    variants: [全体]
    chars: [4500, 7500]
    outline: [この案内について, 対象と定員, 入学までの流れ, 必要な書類, 入学後の日程]
    style: ご案内の文体（です・ます）。表を使ってよい。
  - id: tuition
    doc_type: manual
    title: "{label} 学費・納付金のご案内"
    tags: [fee]
    variants: [全体]
    chars: [4500, 7500]
    outline: [このご案内について, 費用の種類, 納め方, 減免と支援, 返金]
    style: ご案内の文体（です・ます）。費用は表で示してよい。
  - id: school-life
    doc_type: manual
    title: "{label} 学校生活の手引き"
    tags: [life]
    variants: [全体]
    chars: [4500, 7500]
    outline: [この手引きについて, 一日の流れ, 持ち物と服装, 行事と年間の予定, ご家庭へのお願い]
    style: しおりの文体（です・ます）。
  - id: safety
    doc_type: manual
    title: "{label} 安全・防災のしおり"
    tags: [safety]
    variants: [全体]
    chars: [4500, 7500]
    outline: [このしおりについて, 避難訓練, 空気を整える設備, けがや病気のとき, 災害や緊急のときの連絡]
    style: しおりの文体（です・ます）。手順は番号を付けて 1 文ずつ。
