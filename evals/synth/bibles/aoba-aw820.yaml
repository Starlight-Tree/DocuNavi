# あおば電機 全自動洗濯乾燥機 AW-820（架空）の共通設定。既存の資料 evals/corpora/guides/source/aoba_aw820_manual.md と矛盾しないように起こした。
# 事実（facts）にある数値・日付・時刻だけが、生成した本文に出てよい。足す・直すと version が変わる。
target: aoba-aw820
label: あおば電機 AW-820
existing_documents: 1
revision: 2026年11月1日改訂
premise: あおば電機の全自動洗濯乾燥機 AW-820（洗濯8kg・乾燥4.5kg）。家庭用。問い合わせ先は、あおばサポートセンターと、お買い上げの販売店。
contacts: []
forbidden: [パナソニック, 日立, シャープ, 東芝, ダイソン, アイリスオーヤマ]
extra_numbers: []

facts:
  - {id: capacity, tags: [core, safety, spec, run], text: "洗濯できる衣類の重さは、原則として8kgまで。ただし、毛布を洗うときは2.0kgまでとし、羽毛布団と電気毛布は洗えない。"}
  - {id: dry-capacity, tags: [run, spec], text: "乾燥できる量は、原則として4.5kgまで。ただし、ふんわり乾燥コースでは2.0kgまで。"}
  - {id: lid-lock, tags: [safety, run], text: "運転中は、原則としてふたを開けられない。ただし、一時停止ボタンを押すと、約90秒後にロックが外れてふたを開けられる。槽内の水温が50℃以上のときや水位が高いときは、ロックが外れない。"}
  - {id: bath-water, tags: [safety, run], text: "洗いと最初のすすぎには、お風呂の残り湯を使える。ただし、最後のすすぎには必ず水道水を使う。入浴剤が入った残り湯は使わない。"}
  - {id: child, tags: [safety], text: "お子さまが洗濯槽に入らないよう、使わないときはふたを閉める。ふたの上に10kgを超える物を載せない。"}
  - {id: flammable, tags: [safety], text: "ガソリンや灯油などの引火性の液体が付いた衣類は、洗濯も乾燥もしない。火災の原因になる。"}
  - {id: place, tags: [install], text: "設置場所は、水平で丈夫な床にする。防水パンの上に置くときは、内寸の幅が640mm以上のものを選ぶ。壁から左右5cm、背面10cm以上の空間を空ける。"}
  - {id: hose, tags: [install], text: "排水ホースの先端は、床から10cm以上100cm以下の高さにする。ホースの延長は1本までで、延長後の全体の長さは3mまで。"}
  - {id: water-pressure, tags: [install], text: "水道の水圧は、0.05MPaから0.8MPaの範囲で使う。水圧が低いと、給水に時間がかかる。"}
  - {id: power, tags: [install, spec], text: "電源コンセントは、15A以上の単独のものを使い、アースを必ず接続する。電源は交流100V。"}
  - {id: bolts, tags: [install], text: "運搬用のボルトは4本あり、運転の前に必ず外す。据え付けたあとは、4本の脚の高さを調整し、本体を押して揺れがないか確かめる。"}
  - {id: steps, tags: [run, quick], text: "基本の手順は、衣類を槽に入れてふたを閉め、電源ボタンを押して「標準」コースを選び、洗剤自動投入のタンクの残量を確かめて、スタートボタンを押す。"}
  - {id: tank, tags: [run, quick], text: "洗剤の自動投入タンクの容量は、洗剤が約600mL、柔軟剤が約400mL。タンクに入れる洗剤は液体のものにする。粉末洗剤は、洗剤ケースに直接入れる。"}
  - {id: reserve, tags: [run, quick], text: "予約運転は、1時間後から24時間後まで、1時間単位で設定できる。予約を入れたあとは、ふたを開けない。"}
  - {id: child-lock, tags: [run, quick], text: "チャイルドロックは、一時停止ボタンを3秒間長押しすると入る。解除も同じ操作。"}
  - {id: courses, tags: [run, quick], text: "標準コースは日常の衣類を洗うコース。毛布コースは、洗いとすすぎを2回ずつ行い、脱水を短くする。ふんわり乾燥コースは、ニット類など縮みやすい衣類の乾燥に使う。"}
  - {id: quick-course, tags: [run, quick], text: "おいそぎコースは、洗濯物が2kg以下のときに使い、洗濯だけを約40分で終える。"}
  - {id: sneakers, tags: [run, quick], text: "スニーカーは、洗濯ネットに1足ずつ入れて洗う。ただし、革や合成皮革の靴は洗えない。"}
  - {id: detergent, tags: [run, quick], text: "洗剤の量の目安は、洗濯物1kgあたり5mL。洗剤自動投入を使うと、本体が洗濯物の量を測り、投入量を自動で決める。泡があふれたときは、運転を止めて30分ほど待ってから、スタートボタンを押す。"}
  - {id: take-out, tags: [run, quick], text: "脱水が終わったあとの洗濯物は、すぐに取り出す。入れたままにすると、しわやにおいの原因になる。"}
  - {id: lint-filter, tags: [care], text: "糸くずフィルターは、洗濯10回ごとに取り出して水洗いする。乾燥フィルターは、乾燥のたびに、ごみを取り除く。"}
  - {id: tub-clean, tags: [care], text: "洗濯槽の洗浄は、月に1回、「槽洗浄」コースで行う。塩素系の洗濯槽クリーナーを250mL入れ、約40℃のぬるま湯をためて運転する。槽洗浄コースは、約3時間かかる。"}
  - {id: packing, tags: [care], text: "ふたのゴムパッキンは、半年に1回、水で薄めた中性洗剤で拭く。本体の外側は、柔らかい布で水拭きし、シンナーやベンジンは使わない。"}
  - {id: storage, tags: [care], text: "長期間使わないときは、水栓を閉め、電源プラグを抜く。槽内の水を抜いたあと、ふたを開けたままにして乾燥させる。"}
  - {id: e01, tags: [error], text: "E01はふたエラーで、主な原因はふたの閉め忘れ。対処の目安は約1分。"}
  - {id: e02, tags: [error], text: "E02は給水エラーで、主な原因は蛇口の閉め忘れ。対処の目安は約5分。"}
  - {id: e03, tags: [error], text: "E03は水位エラーで、主な原因は衣類の片寄り。対処の目安は約10分。"}
  - {id: e04, tags: [error], text: "E04は排水エラーで、主な原因は排水ホースのつまり。対処の目安は約30分。ホースを外す前に、水を受ける容器を用意する。"}
  - {id: e05, tags: [error], text: "E05は乾燥エラーで、主な原因は乾燥フィルターのつまり。対処の目安は約20分。"}
  - {id: e06, tags: [error], text: "E06は温度エラーで、主な原因は周囲温度が35℃を超えたこと。対処の目安は約60分。"}
  - {id: e07, tags: [error], text: "E07はモーターエラーで、主な原因は過負荷や部品の故障。修理が必要。"}
  - {id: contact, tags: [error, warranty], text: "対処しても直らないときは、電源プラグを抜き、お買い上げの販売店かあおばサポートセンターに連絡する。連絡のときは、型番と製造番号を知らせる。製造番号は、本体背面の銘板に書かれている。"}
  - {id: blackout, tags: [error], text: "停電のあとは、運転が途中から再開されないことがある。その場合は、電源を入れ直し、もう一度スタートボタンを押す。"}
  - {id: spec, tags: [spec], text: "仕様は、洗濯が容量8kg・標準コース約98分・消費電力約280W・使用水量約95L・運転音約38dB、乾燥が容量4.5kg・標準コース約165分・消費電力約1350W・使用水量約20L・運転音約52dB。"}
  - {id: size, tags: [spec], text: "外形寸法は、幅600mm、奥行き640mm、高さ1020mm。質量は約72kg。"}
  - {id: warranty, tags: [warranty], text: "保証期間は、お買い上げの日から1年間。ただし、モーターは、お買い上げの日から5年間保証する。モーターの保証は、一般の家庭で使った場合に限り、業務用に使った場合は1年間。"}
  - {id: parts, tags: [warranty], text: "補修用の部品は、製造を打ち切ってから8年間保有する。"}
  - {id: support, tags: [warranty], text: "あおばサポートセンターの受付時間は、月曜日から金曜日の午前9時から午後6時まで。土曜日、日曜日、祝日はお休み。"}
  - {id: visit-fee, tags: [warranty], text: "出張修理の費用は、保証期間内は無料。保証期間を過ぎた場合は、出張料が3,300円かかる。"}
  - {id: disposal, tags: [warranty], text: "本体を廃棄するときは、家電リサイクル法の対象になる。お買い上げの販売店に、引き取りを依頼する。"}
  - {id: not-documented, tags: [warranty, install], text: "電源コードの長さ、延長保証の料金、乾燥運転の庫内の温度は、定められていない。"}

