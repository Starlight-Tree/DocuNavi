# リューネ工房 家庭用二人乗り浮上ポッド FP-820（架空）の共通設定。既存の資料 evals/corpora/guides/source/aoba_aw820_manual.md と矛盾しないように起こした。2026-11-19 に、あおば電機の洗濯乾燥機から書き換えた（対象名 aoba-aw820 は変えない）。同日、合成の資料を 19 冊から 4 冊（設置・お手入れ・故障・保証。1 冊 4,500〜7,500 文字）へ統合し、事実を足した。
# 事実（facts）にある数値・日付・時刻だけが、生成した本文に出てよい。足す・直すと version が変わる。
target: aoba-aw820
label: リューネ工房 FP-820
existing_documents: 1
documents: 5
revision: 2026年11月1日改訂
premise: リューネ工房の家庭用二人乗り浮上ポッド FP-820（低空走行は積載量8kg・高空走行は4.5kg）。ドーム都市の家庭で、近所への外出や荷物の運搬に使う。問い合わせ先は、リューネサポートセンターと、お買い上げの販売店。
contacts: []
forbidden: [パナソニック, 日立, シャープ, 東芝, ダイソン, アイリスオーヤマ, ザーハード, 砂漠, 荒野, 酸素, 遺跡, 洗濯]
extra_numbers: []

facts:
  - {id: capacity, tags: [core, safety, spec, run], text: "荷室に積める荷物の重さは、原則として8kgまで。乗員は2名まで。ただし、液体の荷を運ぶときは2.0kgまでとし、圧縮ガスのボンベと発熱する荷は積めない。"}
  - {id: dry-capacity, tags: [run, spec], text: "高空走行で運べる量は、原則として4.5kgまで。ただし、ゆったり高空モードでは2.0kgまで。"}
  - {id: lid-lock, tags: [safety, run], text: "走行中は、原則としてハッチを開けられない。ただし、一時停止ボタンを押すと、約90秒後にロックが外れてハッチを開けられる。冷却水の温度が50℃以上のときや浮上高が高いときは、一時停止ボタンを押してもロックが外れない。機体が着地してから、もう一度試す。"}
  - {id: bath-water, tags: [safety, run], text: "予冷には、ご家庭の雨水タンクの水を使える。ただし、本冷却には必ず水道水を使う。薬剤が入った水は使わない。"}
  - {id: child, tags: [safety], text: "お子さまが機内に入り込まないよう、使わないときはハッチを閉める。機体の屋根に10kgを超える物を載せない。"}
  - {id: flammable, tags: [safety], text: "ガソリンや灯油などの引火性の液体は、荷として積まない。火災の原因になる。"}
  - {id: place, tags: [install], text: "設置場所は、水平で丈夫な床にする。係留台の上に置くときは、内寸の幅が1,300mm以上のものを選ぶ。壁から左右5cm、背面10cm以上の空間を空ける。"}
  - {id: hose, tags: [install], text: "排水ホースの先端は、床から10cm以上100cm以下の高さにする。ホースの延長は1本までで、延長後の全体の長さは3mまで。"}
  - {id: water-pressure, tags: [install], text: "水道の水圧は、0.05MPaから0.8MPaの範囲で使う。水圧が低いと、給水に時間がかかる。"}
  - {id: power, tags: [install, spec], text: "充電用のコンセントは、15A以上の単独のものを使い、アースを必ず接続する。電源は交流100V。"}
  - {id: bolts, tags: [install], text: "輸送用の固定ボルトは4本あり、運転の前に必ず外す。据え付けたあとは、4本の脚の高さを調整し、機体を押して揺れがないか確かめる。"}
  - {id: steps, tags: [run, quick], text: "基本の手順は、乗員が乗り込み、荷物を荷室に入れてハッチを閉め、電源ボタンを押して「標準」モードを選び、冷却液の自動補給タンクの残量を確かめて、スタートボタンを押す。"}
  - {id: tank, tags: [run, quick], text: "冷却液の自動補給タンクの容量は、冷却液が約600mL、潤滑液が約400mL。タンクに入れる冷却液は、冷却水に混ぜる専用の液体のものにする。予備の冷却液は、補給ケースに直接入れる。"}
  - {id: reserve, tags: [run, quick], text: "予約出発は、1時間後から24時間後まで、1時間単位で設定できる。予約を入れたあとは、ハッチを開けない。"}
  - {id: child-lock, tags: [run, quick], text: "チャイルドロックは、一時停止ボタンを3秒間長押しすると入る。解除も同じ操作。"}
  - {id: courses, tags: [run, quick], text: "標準モードは日常の外出に使うモード。重量荷モードは、浮上と着地を2回ずつ行い、巡航を短くする。ゆったり高空モードは、陶器など壊れやすい荷物の運搬に使う。"}
  - {id: quick-course, tags: [run, quick], text: "おいそぎモードは、荷物が2kg以下のときに使い、近所への往復だけを約40分で終える。"}
  - {id: sneakers, tags: [run, quick], text: "植木鉢は、固定ネットに1鉢ずつ入れて運ぶ。ただし、土が崩れやすい鉢は運べない。"}
  - {id: detergent, tags: [run, quick], text: "冷却液の量の目安は、荷物1kgあたり5mL。冷却液の自動補給を使うと、機体が荷物の重さを測り、補給量を自動で決める。冷却液があふれたときは、運転を止めてこぼれた液を拭き取り、30分ほど待ってから、スタートボタンを押す。"}
  - {id: take-out, tags: [run, quick], text: "到着したあとの荷物は、すぐに降ろす。載せたままにすると、荷崩れやにおいの原因になる。"}
  - {id: lint-filter, tags: [care], text: "低空フィルターは、走行10回ごとに取り出して水洗いする。高空フィルターは、高空走行のたびに、ごみを取り除く。"}
  - {id: tub-clean, tags: [care], text: "機内の冷却槽の洗浄は、月に1回、「機内洗浄」モードで行う。塩素系の機内洗浄剤を250mL入れ、約40℃のぬるま湯をためて運転する。機内洗浄モードは、約3時間かかる。"}
  - {id: packing, tags: [care], text: "ハッチのゴムパッキンは、半年に1回、水で薄めた中性洗剤で拭く。機体の外側は、柔らかい布で水拭きし、シンナーやベンジンは使わない。"}
  - {id: storage, tags: [care], text: "長期間使わないときは、水栓を閉め、充電プラグを抜く。冷却槽の水を抜いたあと、ハッチを開けたままにして乾燥させる。"}
  - {id: e01, tags: [error], text: "E01はハッチエラーで、主な原因はハッチの閉め忘れ。対処の目安は約1分。"}
  - {id: e02, tags: [error], text: "E02は給水エラーで、主な原因は蛇口の閉め忘れ。対処の目安は約5分。"}
  - {id: e03, tags: [error], text: "E03は水平エラーで、主な原因は荷物の片寄り。対処の目安は約10分。"}
  - {id: e04, tags: [error], text: "E04は排水エラーで、主な原因は排水ホースのつまり。対処の目安は約30分。ホースを外す前に、水を受ける容器を用意する。"}
  - {id: e05, tags: [error], text: "E05は高空エラーで、主な原因は高空フィルターのつまり。対処の目安は約20分。"}
  - {id: e06, tags: [error], text: "E06は温度エラーで、主な原因は周囲温度が35℃を超えたこと。対処の目安は約60分。"}
  - {id: e07, tags: [error], text: "E07はモーターエラーで、主な原因は過負荷や部品の故障。修理が必要。"}
  - {id: contact, tags: [error, warranty], text: "対処しても直らないときは、充電プラグを抜き、お買い上げの販売店かリューネサポートセンターに連絡する。連絡のときは、型番と製造番号を知らせる。製造番号は、機体後部の銘板に書かれている。"}
  - {id: blackout, tags: [error], text: "停電のあとは、運転が途中から再開されないことがある。その場合は、機体が着地していることを確かめてから、電源を入れ直し、もう一度スタートボタンを押す。"}
  - {id: spec, tags: [spec], text: "仕様は、低空走行が積載量8kg・標準モード約98分・消費電力約280W・使用水量約95L・運転音約38dB、高空走行が積載量4.5kg・標準モード約165分・消費電力約1350W・使用水量約20L・運転音約52dB。"}
  - {id: size, tags: [spec], text: "外形寸法は、幅1,200mm、奥行き1,640mm、高さ1,020mm。質量は約172kg。"}
  - {id: warranty, tags: [warranty], text: "保証期間は、お買い上げの日から1年間。ただし、モーターは、お買い上げの日から5年間保証する。モーターの保証は、一般の家庭で使った場合に限り、業務用に使った場合は1年間。"}
  - {id: parts, tags: [warranty], text: "補修用の部品は、製造を打ち切ってから8年間保有する。"}
  - {id: support, tags: [warranty], text: "リューネサポートセンターの受付時間は、月曜日から金曜日の午前9時から午後6時まで。土曜日、日曜日、祝日はお休み。"}
  - {id: visit-fee, tags: [warranty], text: "出張修理の費用は、保証期間内は無料。保証期間を過ぎた場合は、出張料が3,300円かかる。"}
  - {id: disposal, tags: [warranty], text: "本体を廃棄するときは、お住まいの区域の機体処理規則の対象になる。お買い上げの販売店に、引き取りを依頼する。"}
  - {id: not-documented, tags: [warranty, install], text: "充電コードの長さ、延長保証の料金、高空走行中の機内の温度は、定められていない。"}

  - {id: mooring-level, tags: [install], text: "係留台に置いたあとは、水平器で確かめ、機体が傾いていないことを確認する。傾いていると、浮上のときに機体が揺れる原因になる。"}
  - {id: mooring-height, tags: [install], text: "係留台の高さは、床から30cm以下のものを選ぶ。高すぎると、乗り降りのときに足を踏み外すおそれがある。"}
  - {id: floor-load, tags: [install, safety], text: "床は、機体の質量（約172kg）に、乗員と荷物を加えた重さに耐えるものにする。やわらかい床やぐらつく床には置かない。"}
  - {id: ambient, tags: [install], text: "設置場所の周囲温度は、5℃から35℃の範囲にする。直射日光が当たる場所や、暖房器具の近くには置かない。"}
  - {id: ceiling, tags: [install], text: "機体の上方は、天井まで1.5m以上空ける。浮上するときに、天井や照明に触れないようにするため。"}
  - {id: unpack, tags: [install], text: "開梱したあとは、付属品がそろっているか確かめる。付属品は、取扱説明書、固定ネット、補給ケース、保証書の4点。"}
  - {id: hose-install, tags: [install], text: "排水ホースは、折り曲げたり、つぶしたりしない。機体と排水口への接続部は、ホースバンドで固定する。"}
  - {id: outlet-share, tags: [install, safety], text: "充電用のコンセントには、延長コードやタコ足配線を使わない。ほかの機器と同じコンセントに接続しない。"}
  - {id: first-run, tags: [install], text: "据え付けが終わったら、荷物を載せずに「標準」モードで1回運転し、エラーコードが出ないこと、水漏れがないことを確かめる。"}
  - {id: bolts-keep, tags: [install], text: "取り外した輸送用の固定ボルトは、設置場所を変えるときに使うので、捨てずに保管する。"}
  - {id: relocation, tags: [install], text: "設置場所を変えるときは、充電プラグを抜き、水栓を閉め、冷却槽の水を抜いてから、固定ボルトを4本とも取り付ける。移動は、2人以上で行う。"}
  - {id: care-after-run, tags: [care], text: "走行のあと、機内に水滴が残っているときは、乾いた布で拭き取る。濡れたままハッチを閉めると、においの原因になる。"}
  - {id: care-display, tags: [care], text: "表示窓と操作ボタンは、乾いた柔らかい布で拭く。水や洗剤を直接かけない。"}
  - {id: filter-wash, tags: [care], text: "低空フィルターは、ぬるま湯と柔らかいブラシで洗う。洗ったあとは、日陰で完全に乾かしてから取り付ける。"}
  - {id: packing-check, tags: [care], text: "ハッチのゴムパッキンに、ひび割れや傷があるときは、そのまま使わず、お買い上げの販売店に連絡する。"}
  - {id: tank-care, tags: [care], text: "冷却液の自動補給タンクには、専用の冷却液以外の液体を入れない。口からこぼれた液は、すぐに拭き取る。"}
  - {id: hose-check, tags: [care], text: "排水ホースは、半年に1回、つまりや折れ、接続部のゆるみがないか目で確かめる。"}
  - {id: no-washdown, tags: [care, safety], text: "機体を水で丸洗いしない。高圧洗浄機を使ったり、ホースで直接水をかけたりしない。故障や感電の原因になる。"}
  - {id: chlorine-mix, tags: [care, safety], text: "塩素系の機内洗浄剤は、酸性の洗剤と混ぜない。有害なガスが出て危険。洗浄中は、機内を覗き込まない。"}
  - {id: after-storage, tags: [care], text: "長期間使わなかったあとに使うときは、冷却槽に水が残っていないこと、フィルターが乾いていることを確かめてから、電源を入れる。"}
  - {id: cover-storage, tags: [care], text: "保管中の機体にカバーをかけるときは、機内と機体が完全に乾いてからかける。濡れたままかけると、においやさびの原因になる。"}
  - {id: error-display, tags: [error], text: "エラーコードは、表示窓に出る。運転が止まったときは、まずコードを控え、次の表と対処を見る。"}
  - {id: e01-more, tags: [error], text: "E01が出たときは、ハッチの縁に荷物のひもや布が挟まっていないか確かめ、ハッチを閉め直す。"}
  - {id: e02-more, tags: [error], text: "E02が出たときは、蛇口が開いているか、給水ホースが折れていないかを確かめる。水圧が低いときは、給水に時間がかかる。"}
  - {id: e03-more, tags: [error], text: "E03が出たときは、機体が着地していることを確かめ、荷室の荷物を中央に寄せ、重い物を下に置き直す。"}
  - {id: e04-more, tags: [error], text: "E04が出たときは、排水ホースの先端の高さが決められた範囲にあるか、ホースが折れていないかを確かめる。"}
  - {id: e05-more, tags: [error], text: "E05が出たときは、高空フィルターのごみを取り除いてから、もう一度試す。"}
  - {id: e06-more, tags: [error], text: "E06が出たときは、機体を日陰の涼しい場所へ移し、周囲温度が下がるのを待つ。"}
  - {id: e07-more, tags: [error], text: "E07が出たときは、自分で分解せず、充電プラグを抜いて、お買い上げの販売店かリューネサポートセンターに連絡する。"}
  - {id: error-reset, tags: [error], text: "エラーの原因を取り除いたあとは、電源ボタンで電源を切り、入れ直してから、スタートボタンを押す。"}
  - {id: no-power, tags: [error], text: "電源が入らないときは、充電プラグがコンセントに差さっているか、ブレーカーが落ちていないかを確かめる。"}
  - {id: odd-sound, tags: [error, safety], text: "運転中に、いつもと違う音やにおいがするときは、すぐに一時停止ボタンを押す。機体が着地してから、充電プラグを抜く。"}
  - {id: hatch-stuck, tags: [error], text: "着地したあとにハッチが開かないときは、チャイルドロックが入っていないか確かめる。解除は、一時停止ボタンを3秒間長押しする。"}
  - {id: water-leak, tags: [error, safety], text: "機体の下に水漏れがあるときは、水栓を閉め、充電プラグを抜く。ホースの接続部を確かめても直らないときは、使わずに連絡する。"}
  - {id: contact-prep, tags: [error, warranty], text: "連絡の前に、エラーコード、症状、いつから起きたかを控えておく。型番と製造番号とあわせて知らせると、相談が早く進む。"}
  - {id: warranty-card, tags: [warranty], text: "保証書は、お買い上げの日と販売店名が書かれたものを、大切に保管する。保証書がないと、保証を受けられない。"}
  - {id: warranty-scope, tags: [warranty], text: "保証期間内に、取扱説明書に従った使い方で故障したときは、無料で修理する。"}
  - {id: excl-misuse, tags: [warranty], text: "誤った使い方や、販売店とリューネ工房以外による修理・改造が原因の故障は、保証期間内でも保証の対象外で、有料になる。"}
  - {id: excl-disaster, tags: [warranty], text: "火災、地震、水害などの災害や、異常な電圧が原因の故障は、保証の対象外。"}
  - {id: excl-consumable, tags: [warranty], text: "低空フィルターやゴムパッキンなどの消耗品の交換は、保証の対象外。"}
  - {id: excl-transport, tags: [warranty], text: "お買い上げのあとの輸送や移設、落下が原因の故障は、保証の対象外。"}
  - {id: warranty-owner, tags: [warranty], text: "保証は、保証書に書かれたお買い上げの方に限る。譲り受けた場合は、販売店に相談する。"}
  - {id: warranty-apply, tags: [warranty], text: "保証を受けるときは、保証書を用意して、お買い上げの販売店かリューネサポートセンターに連絡する。"}
  - {id: visit-flow, tags: [warranty], text: "出張修理は、連絡のときに訪問の日時を決め、技術員が訪問して行う。訪問のときは、保証書を見せる。"}
  - {id: paid-repair, tags: [warranty], text: "保証期間を過ぎた修理は有料。費用は、出張料3,300円に、部品代と技術料を加えた額になる。"}
  - {id: parts-def, tags: [warranty], text: "補修用の部品とは、機体の機能を維持するために必要な部品のこと。保有期間を過ぎると、修理できないことがある。"}
  - {id: support-off, tags: [warranty], text: "受付時間外や休日のお問い合わせは、次の営業日に対応する。"}
  - {id: disposal-prep, tags: [warranty], text: "廃棄のための引き取りを依頼する前に、冷却槽の水を抜き、充電プラグを抜いておく。"}

