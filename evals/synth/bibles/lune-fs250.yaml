revision: 2026年11月1日改訂
premise: リューネ工房のひとり乗り浮上スクーター FS-250。ドーム都市の家庭で、近所への移動に使う。問い合わせ先は、お買い上げの販売店と、リューネサポートセンター。
contacts: []
forbidden: [パナソニック, 日立, シャープ, 東芝, ダイソン, アイリスオーヤマ, ザーハード, 砂漠, 荒野, 酸素, 遺跡, 洗濯]
extra_numbers: []

facts:
  - {id: overview, tags: [core, run], text: "FS-250は、リューネ工房のひとり乗り浮上スクーター。ドーム都市の家庭で、近所への移動に使う。ゆっくり・標準・おいそぎの3つの走行モードがある。"}
  - {id: rider-limit, tags: [core, safety, run, spec], text: "乗れるのは、12歳以上で、体重が35kg以上105kg以下の人。乗れるのは1人だけで、2人では乗らない。乗員と荷物を合わせた重さの限度は、110kgまで。"}
  - {id: helmet, tags: [core, safety, run], text: "走るときは、必ずヘルメットを着け、あご紐をしっかり締める。ヘルメットを着けずに走らない。"}
  - {id: top-speed, tags: [core, run], text: "最高速度は、22km/h前後。おいそぎモードのときだけ、この速さまで出せる。"}
  - {id: stop-system, tags: [core, safety, run, quick], text: "止まるときは、左手のブレーキレバーを握る。握るほど減速し、握ったままにすると停止して、機体がその場に着地する。走り出す前に、ブレーキレバーを一度握って、効き具合を確かめる。"}
  - {id: hands-and-feet, tags: [safety, run], text: "走行中は、両手でハンドルを握り、両足をステップに載せる。片手運転、傘をさす運転、ながら運転はしない。お酒を飲んだときや眠いときは、乗らない。サンダルなど、足が固定されない履き物では乗らない。"}
  - {id: weather, tags: [safety, run], text: "大雨、雪、路面の凍結のときは、走らない。小雨のときは走れるが、水たまりには入らない。ぬれた路面ではブレーキの効きが悪くなるので、ゆっくりモードを使う。前が見えないほどの急な坂は、走らない。"}
  - {id: emergency-stop, tags: [safety, run], text: "危ないと感じたら、ハンドルの右側にある赤い非常停止ボタンを押す。浮上ユニットが止まり、約4秒でその場にゆっくり着地する。着地したあとは、電源を入れ直すまで機体は動かない。"}
  - {id: auto-stop, tags: [safety, run], text: "ステップから両足が離れると、約2秒後に浮上ユニットが自動で止まり、機体が着地する。降りるときは、必ず停止してから足を下ろす。"}
  - {id: night-light, tags: [safety, run], text: "夕方や暗いときは、必ずライトを点灯して走る。ライトの入り切りは、パネルのライトボタンで行う。ベルは、ハンドルの左側のベルボタンで鳴らす。"}
  - {id: steps, tags: [run, quick], text: "基本の手順は、バッテリーの残量を確かめ、ヘルメットを着け、電源ボタンを押し、モードを選び、ステップに乗って、右手のスロットルレバーを親指でそっと押す。"}
  - {id: power-on, tags: [run, quick], text: "電源は、ハンドル中央のパネルの電源ボタンで入れる。電源を入れると約5秒の自己点検があり、その間はステップに乗らない。モードは、停止しているときにモードボタンで切り替える。走行中に押しても切り替わらない。"}
  - {id: mode-slow, tags: [run, quick], text: "ゆっくりモードは、最高速度が6km/hで、浮上高は80mm。人の多い場所、段差の近く、乗り降りのときに使う。人が多い場所では、歩く速さ以下で走る。"}
  - {id: mode-standard, tags: [run, quick], text: "標準モードは、最高速度が15km/hで、浮上高は120mm。日常の近所への移動に使うモード。電源を入れたときは、標準モードになっている。"}
  - {id: mode-quick, tags: [run, quick], text: "おいそぎモードは、最高速度まで出せるモードで、浮上高は150mm。人のいない広い専用路だけで使う。バッテリーの減りが早い。"}
  - {id: where-to-ride, tags: [run, safety], text: "走れるのは、歩行者と共用の浮上路と、敷地内の通路。車道、階段、水辺の縁は走れない。曲がり角と出入口の前では、必ず止まる。走れない場所では、機体を降りて手で押して歩く。"}
  - {id: handlebar-fold, tags: [run, quick], text: "ハンドルを折りたたむときは、停止して電源を切り、ハンドルの根元の解除レバーを引き上げて、前へ倒す。起こすときは、カチッと音がするまで起こす。ハンドルの高さは、根元のロックを外して4段階に調整できる。折りたたんだままでは走れない。"}
  - {id: cargo-basket, tags: [run, quick, safety], text: "手荷物は、前かごに入れて運ぶ。前かごに入れられるのは、3kgまで。ハンドルに袋を掛けない。液体の入った容器と割れやすい物は、ふたを閉めてかごに固定する。引火性の物は運ばない。"}
  - {id: battery-lamps, tags: [run, quick], text: "バッテリーの残量は、パネルの5つのランプで見る。ランプが1つだけ点灯したときは、残りがわずか。走るのをやめ、ゆっくりモードで近くの充電場所へ戻る。"}
  - {id: running-time, tags: [run, quick, spec], text: "満充電からの連続走行時間は、標準モードで約80分。おいそぎモードでは、バッテリーが早く減り、これより短い。"}
  - {id: after-ride, tags: [run, quick, safety], text: "走り終えたら、電源を切り、キーを回してロックし、ハンドルを折りたたむ。キーは、予備を別の場所に保管する。お子さまが触れたり乗ったりしないよう、キーを抜いて手の届かない場所に置く。"}
  - {id: unpack, tags: [install], text: "箱の中身は、本体、バッテリー、充電器、キー（2本）、取扱説明書、保証書。足りない物があるときは、お買い上げの販売店に連絡する。"}
  - {id: place, tags: [install], text: "設置・保管の場所は、水平で乾いた屋内の床にする。屋外に置くときは、雨と直射日光の当たらない屋根の下にする。"}
  - {id: space-heat, tags: [install], text: "機体の周りには、左右に500mm以上の空間を空ける。暖房器具などの熱源からは、1m以上離す。"}
  - {id: temp-range, tags: [install, spec, run], text: "使える周囲温度は、0℃以上40℃以下。この範囲の外では、バッテリーの能力が落ち、浮上しないことがある。"}
  - {id: charger-power, tags: [install, spec], text: "充電用のコンセントは、10A以上の単独のものを使い、アースを必ず接続する。電源は交流100V。"}
  - {id: charger-cable, tags: [install], text: "充電器のコードの長さは1.8m。延長コードは使わず、コンセントの近くに機体を置く。"}
  - {id: battery-attach, tags: [install], text: "バッテリーは、座面の後ろのくぼみに、差し込み口を下にして、カチッと音がするまで押し込む。外すときは、ロックボタンを押しながら引き上げる。付けたあとは、軽く引いて外れないか確かめる。"}
  - {id: handlebar-assemble, tags: [install], text: "箱から出したときは、ハンドルが倒れている。ハンドルを起こして、カチッと音がするまで固定し、根元の固定ボルトを2本締める。ボルトを締め忘れて走らない。"}
  - {id: sensor-sheet, tags: [install], text: "機体の底の浮上センサーに貼ってある保護シートは、使う前に必ず剥がす。貼ったままだと、浮上しない。"}
  - {id: initial-charge, tags: [install], text: "初めて使う前に、バッテリーを約6時間かけて充電する。充電中は、可燃物を機体の近くに置かない。"}
  - {id: test-ride-area, tags: [install, run], text: "初めて走るときは、人のいない平らな場所で、ゆっくりモードから始める。広さは、縦横それぞれ10m以上あるとよい。ブレーキと停止を、練習してから出かける。"}
  - {id: door-pass, tags: [install], text: "玄関や廊下を通すときは、ハンドルを折りたたんで、手で押して運ぶ。通路の幅は、800mm以上を目安にする。"}
  - {id: storage-spot, tags: [install], text: "保管の場所は、床がしっかりして、湯気や水しぶきがかからない屋内にする。階段の下や出入口の前など、人が通る場所には置かない。"}
  - {id: not-documented, tags: [warranty, install], text: "延長保証の料金、屋外保管用カバーの寸法、坂道を上れる最大の傾きは、定められていない。"}
  - {id: pre-ride-check, tags: [care, safety], text: "走る前に、ハンドルのぐらつき、ブレーキレバーの効き、浮上センサーの汚れ、バッテリーの残量を確かめる。1つでもおかしいときは、走らない。"}
  - {id: sensor-clean, tags: [care], text: "浮上センサーは、月に1回、乾いた柔らかい布で拭く。砂やほこりが付いたままだと、浮上が不安定になる。"}
  - {id: intake-filter, tags: [care], text: "吸気フィルターは、走行20回ごとに取り外して、ブラシでほこりを払う。1年に1回は水洗いし、陰で完全に乾かしてから戻す。"}
  - {id: vent-clean, tags: [care], text: "浮上ユニットの吹き出し口は、走行10回ごとに、掃除機でごみを吸う。吹き出し口に、棒や指を入れない。"}
  - {id: body-wipe, tags: [care], text: "機体の外側は、固く絞った柔らかい布で拭く。シンナー、ベンジン、研磨剤は使わない。"}
  - {id: no-water, tags: [care, safety], text: "機体に水をかけて洗わない。高圧洗浄機も使わない。水がかかったときは、電源を切り、乾いた布で拭いて、乾くまで充電しない。"}
  - {id: battery-terminal, tags: [care], text: "バッテリーの端子は、2か月に1回、乾いた布で拭く。端子に傷や変形があるバッテリーは、使わない。"}
  - {id: battery-storage, tags: [care], text: "長期間使わないときは、バッテリーを外し、残量ランプが2つから3つの状態にして、涼しい屋内に置く。3か月ごとに、補充電する。"}
  - {id: brake-inspect, tags: [care, safety], text: "ブレーキは、1年に1回、お買い上げの販売店で点検を受ける。レバーの握りしろが大きくなったときは、すぐに点検を受ける。"}
  - {id: hinge-care, tags: [care], text: "ハンドルの折りたたみ部は、半年に1回、乾いた布で砂やごみを拭き取る。油は差さない。"}
  - {id: pad-wear, tags: [care], text: "ステップのゴムパッドは、溝の深さが1mm未満になったら、お買い上げの販売店で交換する。"}
  - {id: no-spray, tags: [care], text: "油の入ったスプレーや洗剤を、浮上ユニットとセンサーにかけない。故障や、浮上の不具合の原因になる。"}
  - {id: battery-safety, tags: [care, safety], text: "落としたり、ぶつけたりして傷が付いたバッテリーは、使わない。充電器は、付属のものだけを使う。"}
  - {id: no-modify, tags: [care, safety], text: "機体の分解や改造は、しない。浮上ユニットとバッテリーの中は、お客様では直せない。"}
  - {id: error-display, tags: [error], text: "エラーが起きると、パネルにS01からS07のエラーコードが表示され、ブザーが3回鳴る。機体は、浮上ユニットを止めて着地する。"}
  - {id: s01, tags: [error], text: "S01はバッテリー残量エラーで、主な原因は残量の不足。充電して復帰する目安は、約30分。"}
  - {id: s02, tags: [error], text: "S02は浮上エラーで、主な原因は浮上センサーの汚れや、路面の悪さ。対処の目安は約10分。"}
  - {id: s03, tags: [error], text: "S03は傾きエラーで、主な原因は機体が大きく傾いたこと。平らな場所に戻す。対処の目安は約2分。"}
  - {id: s04, tags: [error], text: "S04はハンドル固定エラーで、主な原因はハンドルの固定の不足。対処の目安は約1分。"}
  - {id: s05, tags: [error], text: "S05は温度エラーで、主な原因は浮上ユニットの温度の上がりすぎ。電源を切って待つ。対処の目安は約40分。"}
  - {id: s06, tags: [error], text: "S06は荷重エラーで、主な原因は乗員と荷物の重さが限度を超えたこと。荷物を減らす。対処の目安は約3分。"}
  - {id: s07, tags: [error], text: "S07は浮上ユニットエラーで、主な原因は部品の故障や過負荷。修理が必要。"}
  - {id: error-reset, tags: [error], text: "エラーを解除するには、原因を取り除いてから、電源ボタンを7秒間長押しして、電源を入れ直す。解除できないときは、無理に走らない。"}
  - {id: no-power, tags: [error], text: "電源が入らないときは、バッテリーが奥まで入っているか、残量があるかを確かめる。キーがロックの位置になっていないかも確かめる。"}
  - {id: no-lift, tags: [error], text: "浮上しないときは、保護シートの剥がし忘れ、浮上センサーの汚れ、ステップに足が載っているか、ハンドルの固定を確かめる。"}
  - {id: battery-hot, tags: [error, safety], text: "充電中に、バッテリーが熱くなったり、においがしたり、ふくらんだりしたときは、すぐに充電器を抜き、使わない。お買い上げの販売店かリューネサポートセンターに連絡する。"}
  - {id: blackout, tags: [error], text: "停電のあとは、充電が止まっていることがある。復旧したら、充電器のプラグを挿し直す。走行中に停電が起きても、バッテリーで動くので、影響はない。"}
  - {id: contact, tags: [error, warranty], text: "対処しても直らないときは、電源を切り、バッテリーを外して、お買い上げの販売店かリューネサポートセンターに連絡する。連絡のときは、型番と製造番号を知らせる。"}
  - {id: nameplate, tags: [warranty, spec], text: "型番と製造番号は、機体のステップの裏にある銘板に書かれている。"}
  - {id: warranty-period, tags: [warranty], text: "保証期間は、お買い上げの日から1年間。ただし、浮上ユニットは、お買い上げの日から4年間保証する。"}
  - {id: household, tags: [warranty], text: "浮上ユニットの長い保証は、一般の家庭で使った場合に限る。貸し出しなどの業務用に使った場合は、浮上ユニットも1年間。"}
  - {id: warranty-scope, tags: [warranty], text: "取扱説明書に従って使い、保証期間内に故障したときは、無料で修理する。保証書に、お買い上げの日と販売店名の記入が必要。"}
  - {id: warranty-card, tags: [warranty], text: "保証書は、お買い上げの日と販売店名が書かれたものだけが有効。再発行はしないので、大切に保管する。"}
  - {id: exclusions, tags: [warranty], text: "次の場合は、保証期間内でも有料になる。使い方の誤り、落下や衝突、改造や分解、火災や水没、輸送中の傷。バッテリーの容量が、使うほど自然に減ることも、故障ではなく、保証の対象にならない。"}
  - {id: visit-fee, tags: [warranty], text: "出張修理の費用は、保証期間内は無料。保証期間を過ぎた場合は、出張料が3,300円かかる。"}
  - {id: repair-steps, tags: [warranty], text: "修理を頼むときは、電源を切り、バッテリーを外して、型番、製造番号、症状、お買い上げの日を用意して連絡する。出張の日は、販売店と相談して決める。"}
  - {id: repair-parts, tags: [warranty], text: "補修用の部品は、製造を打ち切ってから7年間保有する。"}
  - {id: support, tags: [warranty], text: "リューネサポートセンターの受付時間は、月曜日から金曜日の午前9時から午後6時まで。土曜日、日曜日、祝日はお休み。"}
  - {id: disposal, tags: [warranty], text: "本体を廃棄するときは、お住まいの区域の機体処理規則の対象になる。お買い上げの販売店に、引き取りを依頼する。"}
  - {id: battery-disposal, tags: [warranty], text: "バッテリーと充電器は、一般のごみに出さない。お買い上げの販売店に、引き取りを依頼する。"}
  - {id: size, tags: [spec], text: "外形寸法は、ハンドルを起こしたときに、全長1,150mm、幅560mm、高さ1,080mm。ハンドルを折りたたむと、高さは620mmになる。"}
  - {id: weight, tags: [spec], text: "質量は、バッテリーを含めて約21kg。バッテリー単体の質量は、約3.2kg。"}
  - {id: battery-spec, tags: [spec], text: "バッテリーの電圧は36V。付属の充電器の出力は42Vで、満充電までの時間は約3.5時間。"}
  - {id: power-noise, tags: [spec], text: "浮上ユニットの消費電力は、標準モードで約420W。運転音は約46dB。充電器の消費電力は約90W。"}

