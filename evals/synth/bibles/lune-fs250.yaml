# リューネ工房 ひとり乗り浮上スクーター FS-250（架空）の共通設定。近所の移動に使う家庭用の乗り物として、2026-11-19 に新しく作った。
# 事実（facts）にある数値・日付・時刻だけが、生成した本文に出てよい。足す・直すと version が変わる。
target: lune-fs250
