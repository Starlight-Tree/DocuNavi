# リューネ工房 充電係留ステーション FD-300（架空）の共通設定。機体を係留して充電する、据え置きの付属品（同時に2機まで）。
# 2026-11-19 に作った。事実（facts）にある数値・日付・時刻だけが、生成した本文に出てよい。足す・直すと version が変わる。
target: lune-fd300
label: リューネ工房 FD-300
existing_documents: 0
documents: 5
revision: 2026年11月1日改訂
premise: リューネ工房の充電係留ステーション FD-300（同時に2機まで係留して充電できる据え置きの台）。ドーム都市の家庭の屋内や屋外に置き、浮上する機体の充電と係留に使う。問い合わせ先は、リューネサポートセンターと、お買い上げの販売店。
contacts: []
forbidden: [パナソニック, 日立, シャープ, 東芝, ダイソン, アイリスオーヤマ, ザーハード, 砂漠, 荒野, 酸素, 遺跡, 洗濯]
extra_numbers: []

facts:
  - {id: overview, tags: [core, spec], text: "充電係留ステーション FD-300は、浮上する機体を係留して充電する、据え置きの台。同時に2機まで係留でき、屋内にも屋外にも置ける。"}
  - {id: compatible, tags: [core, run, spec], text: "対応機種は、FP-820、FS-250、FC-410の3機種。これ以外の機種は、係留も充電もできない。"}
  - {id: slots, tags: [core, run, safety], text: "係留する場所は、台の左側と右側の2か所。1か所に係留できるのは1機で、3機目は係留できない。"}
  - {id: wet-hands, tags: [safety, run], text: "ぬれた手で、電源プラグや操作パネルに触れない。感電の原因になる。"}
  - {id: arm-pinch, tags: [safety, run], text: "係留アームが動くときは、アームと機体の係留リングのあいだに、手や指を入れない。アームが閉じる力は約35kgあり、挟まるとけがをする。お子さまが台やアームに近づかないよう、目を離さない。"}
  - {id: thunder, tags: [safety, run], text: "雷が鳴りはじめたら、充電を止めて電源プラグを抜く。屋外では、機体を屋内に移す。"}
  - {id: flammable-around, tags: [safety, install], text: "台の周囲30cm以内には、ガソリン・灯油・スプレー缶などの引火性の物を置かない。火災の原因になる。"}
  - {id: flood, tags: [safety, install], text: "道路の冠水や、台の足元が水につかるおそれがあるときは、電源プラグを抜き、機体を高い場所に移す。冠水した台は、使わずに販売店に連絡する。"}
  - {id: no-disassemble, tags: [safety, care], text: "台を分解したり、改造したりしない。充電ユニットの内部には高電圧の部分があり、修理はお買い上げの販売店かリューネサポートセンターに依頼する。"}
  - {id: cord-damage, tags: [safety, care], text: "電源コードや電源プラグが傷んでいるときは、使わない。コードを束ねたまま使ったり、重い物を載せたり、踏んだりしない。"}
  - {id: basic-steps, tags: [run, quick], text: "基本の手順は、機体を地上高50cm以下で台の正面からゆっくり近づけ、係留ボタンを押してアームを伸ばし、アームを機体の係留リングに掛けてもう一度係留ボタンを押し、アームの固定灯が点灯して表示灯が青の点灯に変わったことを確かめる。充電は係留が終わると自動で始まり、スタートボタンは要らない。"}
  - {id: power-button, tags: [run, quick], text: "電源ボタンを2秒間長押しすると、電源が入る。切るときも同じ操作。電源が入ると、中央の電源灯が点灯する。"}
  - {id: mooring-arm, tags: [run, quick], text: "係留アームは、左右に1本ずつある。係留ボタンを押すとアームが伸び、機体の係留リングに掛けてもう一度押すと、アームが縮んで機体を引き寄せ、固定する。固定されると「カチッ」と音がして、固定灯が点灯する。固定灯が点灯しないときは、充電は始まらない。"}
  - {id: modes, tags: [run, quick], text: "充電のモードは、通常充電・急速充電・いたわり充電・予約充電の4つ。モードは、操作パネルのモードボタンで切り替える。選んだモードは、左右の係留位置ごとに別々に設定できる。"}
  - {id: normal-charge, tags: [run, quick], text: "通常充電は、日常の充電に使うモードで、空の状態から満充電まで約6時間かかる。2機を同時に係留しても、1機あたりの充電時間は変わらない。"}
  - {id: quick-charge, tags: [run, quick], text: "急速充電は、満充電まで約3.5時間で終える。1機だけを係留しているときに限って選べる。2機を係留しているときは選べず、通常充電になる。"}
  - {id: gentle-charge, tags: [run, quick], text: "いたわり充電は、満充電の8割で充電を止める。毎日使う機体や、しばらく使わない機体の電池の傷みを減らすときに使う。"}
  - {id: reserve, tags: [run, quick], text: "予約充電は、1時間後から12時間後まで、1時間単位で充電の開始を設定できる。予約を入れた側の表示灯は、青の点滅になる。"}
  - {id: release, tags: [run, quick], text: "充電を止めて機体を離すときは、停止ボタンを押して表示灯が白の点灯に変わったあと、解除ボタンを押す。約5秒後にアームが縮み、機体が外れる。充電の途中でも、同じ操作で外せる。"}
  - {id: panel, tags: [run], text: "操作パネルには、電源ボタン・係留ボタン・モードボタン・停止ボタン・解除ボタンがある。左右の係留位置ごとに、係留ボタンと解除ボタンが1つずつ付いている。"}
  - {id: child-lock, tags: [run, quick, safety], text: "ボタンの誤操作を防ぐ操作ロックは、モードボタンと停止ボタンを同時に4秒間長押しすると入る。解除も同じ操作。"}
  - {id: lamps, tags: [run, quick], text: "表示灯は、左右の係留位置に1つずつある。白の点灯は待機、青の点灯は充電中、青の点滅は予約待ち、緑の点灯は充電完了、黄の点滅は強風の注意、赤の点滅はエラーを表す。"}
  - {id: wind-caution, tags: [run, safety], text: "風速が35km/hを超えると、風検知センサーが働いて、表示灯が黄の点滅になる。黄の点滅のあいだは、新しく機体を係留できない。すでに係留している機体の充電は、続く。"}
  - {id: wind-lock, tags: [run, safety], text: "風速が55km/hを超えたときは、充電を自動で止め、アームが機体を強く保持する（強風保持）。強風保持のあいだは、解除ボタンを押しても、アームは外れない。"}
  - {id: wind-recover, tags: [run, safety], text: "風が弱まって黄の点滅が消え、そのまま20分たつと、強風保持が解け、充電が自動で再開される。"}
  - {id: wind-forecast, tags: [run, safety], text: "暴風の予報が出たときは、機体を屋内に移し、アームを格納位置に戻して、電源プラグを抜く。"}
  - {id: place-indoor, tags: [install], text: "屋内では、水平で丈夫な床に置く。機体が出入りするため、台の左右に40cm以上、正面に1.5m以上の空間を空ける。"}
  - {id: place-outdoor, tags: [install], text: "屋外では、水はけのよい場所を選ぶ。水がたまりやすい低い場所や、台の足元が水につかる場所には置かない。"}
  - {id: ground, tags: [install], text: "固定する地面は、厚さ100mm以上のコンクリートなど、丈夫な舗装にする。土の地面には、固定できない。"}
  - {id: anchors, tags: [install, spec], text: "固定アンカーは4本。1本ずつ、深さ80mmの穴に打ち込む。引き抜きに耐える力は、1本あたり約300kg。"}
  - {id: anchor-drill, tags: [install], text: "固定の手順は、まず台の底板を置く位置に合わせ、アンカーの穴の位置に印を付ける。次に台をどけて、印の位置に穴をあける。"}
  - {id: anchor-tighten, tags: [install], text: "穴をあけたら台を戻し、アンカーを打ち込んで、付属のレンチでナットを締める。ナットが動かなくなったら、さらに半回転締める。そのあと、台の脚の高さを調整して、水準器の目盛りの内に収める。"}
  - {id: power-supply, tags: [install, spec], text: "充電用のコンセントは、10A以上の単独のものを使い、アースを必ず接続する。延長コードやタコ足配線は使わない。"}
  - {id: outdoor-outlet, tags: [install, safety], text: "屋外でコンセントを使うときは、防雨型で、漏電しゃ断器の付いたものを使う。差し込み部には、防水カバーを付ける。"}
  - {id: cord, tags: [install, spec], text: "電源コードの長さは約2.5m。コンセントは、コードがむりなく届く位置に用意する。"}
  - {id: wind-site, tags: [install], text: "建物の角など、風が強く集まる場所は避けて設置する。"}
  - {id: first-test, tags: [install, run], text: "設置が終わったら、電源を入れて表示灯が白の点灯になることを確かめる。そのあと、機体を1機係留して、アームの固定灯が点灯し、充電が始まることを確かめる。"}
  - {id: care-first, tags: [care, safety], text: "お手入れの前に、必ず電源プラグを抜く。ぬれた手では行わない。"}
  - {id: surface, tags: [care], text: "台の外側は、柔らかい布で乾拭きする。汚れが落ちないときは、水で薄めた中性洗剤を含ませた布で拭く。シンナー・ベンジン・アルコールは使わない。"}
  - {id: panel-care, tags: [care], text: "操作パネルは、水をかけず、固く絞った布で拭く。ボタンのすき間に水が入らないようにする。"}
  - {id: arm-clean, tags: [care], text: "係留アームの先端の受け金具は、月に1回、乾いた布で砂やほこりを拭き取る。"}
  - {id: grease, tags: [care], text: "アームの伸び縮みする部分には、4か月に1回、専用のシリコングリスを薄く塗る。食用油などの油は使わない。"}
  - {id: contacts, tags: [care], text: "充電端子は、14日に1回、乾いた綿棒で拭く。端子を水洗いしたり、金属のブラシでこすったり、油やグリスを付けたりしない。"}
  - {id: vent, tags: [care], text: "台の側面の通風口は、2か月に1回、掃除機のブラシでほこりを取る。通風口をふさがない。"}
  - {id: sensor, tags: [care], text: "風検知センサーは、台の上面にある。3か月に1回、柔らかい刷毛で、ほこりや落ち葉、くもの巣を取り除く。"}
  - {id: leaves, tags: [care], text: "屋外では、台の足元の落ち葉や泥を、10日に1回取り除く。水はけの穴をふさがない。"}
  - {id: anchor-check, tags: [care, safety, install], text: "アンカーのナットの緩みは、6か月に1回確かめる。緩んでいたら締め直し、緩みが直らないときは、使うのを止めて販売店に連絡する。"}
  - {id: storage, tags: [care], text: "長期間使わないときは、電源プラグを抜き、アームを格納位置に戻して、乾いた布で全体を拭く。屋外に置いたままにするときは、差し込み部に防水カバーを付けておく。"}
  - {id: water-no, tags: [care, safety], text: "高圧洗浄機や、勢いの強い水で、台を直接洗わない。内部に水が入り、漏電の原因になる。"}
  - {id: d01, tags: [error], text: "D01は係留エラーで、主な原因はアームが機体の係留リングから外れた、または掛からなかったこと。対処の目安は約3分。"}
  - {id: d02, tags: [error], text: "D02は端子エラーで、主な原因は充電端子の汚れ。対処の目安は約15分。"}
  - {id: d03, tags: [error, spec], text: "D03は温度エラーで、主な原因は周囲温度が使える範囲を超えたこと。使える周囲温度は0℃から45℃。対処の目安は約40分。通風口のふさがりも原因になる。"}
  - {id: d04, tags: [error], text: "D04は風検知エラーで、主な原因は風検知センサーの汚れや故障。対処の目安は約10分。D04が出ているあいだは、強風のときの自動保護が働かないため、屋外では機体を係留しない。"}
  - {id: d05, tags: [error], text: "D05は漏電エラーで、主な原因は水の侵入や配線の傷。電源プラグを抜き、乾かして様子を見る。対処の目安は約2時間。"}
  - {id: d06, tags: [error], text: "D06はアームエラーで、主な原因はアームのモーターの過負荷や故障。修理が必要。"}
  - {id: error-lamp, tags: [error, run], text: "エラーのときは、表示灯が赤の点滅になる。点滅の回数がエラーコードの番号を表し、D01は1回、D06は6回。"}
  - {id: not-charging, tags: [error], text: "係留したのに充電が始まらないときは、アームの固定灯が点灯しているか、電源プラグが差さっているか、コンセントの漏電しゃ断器が切れていないかを確かめる。表示灯がまったく点かないときも、同じ点を確かめる。"}
  - {id: arm-stuck, tags: [error], text: "解除ボタンを押してもアームが外れないときは、強風保持のあいだの可能性が高い。風が弱まって強風保持が解けるのを待つ。"}
  - {id: blackout, tags: [error], text: "停電のあとは、充電が自動で再開されないことがある。その場合は、電源を入れ直し、解除ボタンでアームを外してから、もう一度係留する。"}
  - {id: emergency-release, tags: [error, run], text: "停電のときや、アームが動かないときは、台の背面にある非常解除レバーを引くと、電源がなくてもアームが外れる。機体を離したあとは、販売店かリューネサポートセンターに連絡する。"}
  - {id: contact, tags: [error, warranty], text: "対処しても直らないときは、電源プラグを抜き、お買い上げの販売店かリューネサポートセンターに連絡する。連絡のときは、型番と製造番号を知らせる。製造番号は、台の背面の銘板に書かれている。"}
  - {id: w-procedure, tags: [error, warranty], text: "出張修理を申し込むときは、販売店かリューネサポートセンターに、型番・製造番号・症状・お買い上げの日を知らせる。訪問の日程は、申込のときに相談して決める。"}
  - {id: support, tags: [error, warranty], text: "リューネサポートセンターの受付時間は、月曜日から金曜日の午前9時から午後6時まで。土曜日、日曜日、祝日はお休み。"}
  - {id: w-period, tags: [warranty], text: "保証期間は、お買い上げの日から1年間。ただし、充電ユニットは、お買い上げの日から3年間保証する。"}
  - {id: w-home, tags: [warranty], text: "充電ユニットの長い保証は、一般の家庭で使った場合に限る。業務用に使った場合は、ほかの部分と同じ保証期間になる。"}
  - {id: w-start, tags: [warranty], text: "保証期間は、お買い上げの日から数える。お買い上げの日を示す書類（領収書など）を、保管しておく。保証は、お買い上げ本人に限り有効で、他の人に譲った場合は対象外になる。"}
  - {id: w-scope, tags: [warranty], text: "取扱説明書に従った使い方で、保証期間内に故障したときは、無料で修理する。"}
  - {id: w-excl-use, tags: [warranty], text: "次の場合は、保証期間内でも対象外になる。誤った使い方、分解や改造、対応機種以外の機体を係留したこと、お手入れの不足による故障。"}
  - {id: w-excl-disaster, tags: [warranty], text: "火災・地震・洪水・落雷などの天災や、冠水による故障は、保証期間内でも対象外になる。"}
  - {id: w-anchor, tags: [warranty, install], text: "固定アンカーで地面に固定せずに使って生じた故障や破損は、保証の対象外になる。"}
  - {id: visit-fee, tags: [warranty], text: "出張修理の費用は、保証期間内は無料。保証期間を過ぎた場合は、出張料が3,300円かかる。"}
  - {id: parts, tags: [warranty], text: "補修用の部品は、製造を打ち切ってから7年間保有する。"}
  - {id: disposal, tags: [warranty], text: "台を廃棄するときは、お住まいの区域の機体処理規則の対象になる。お買い上げの販売店に、引き取りを依頼する。"}
  - {id: not-documented, tags: [warranty, install], text: "延長保証の料金と、停電から充電が再開されるまでの時間は、定められていない。"}
  - {id: size, tags: [spec], text: "外形寸法は、幅760mm、奥行き520mm、高さ1,180mm。質量は約46kg。"}
  - {id: power-spec, tags: [spec], text: "電源は交流100V。最大消費電力は約820W、待機時の消費電力は約6W。"}
  - {id: output, tags: [spec], text: "充電の出力は、通常充電が1機あたり360W、急速充電が650W。2機を同時に充電するときの出力の合計は、最大720W。"}
  - {id: arm-spec, tags: [spec], text: "係留アームは、伸ばした長さが最大1,400mmで、1本あたり約400kgの引っ張りに耐える。"}
  - {id: noise, tags: [spec], text: "運転音は、通常充電中が約33dB、急速充電中が約41dB。"}
  - {id: rain, tags: [spec, install, run], text: "防雨構造で、1時間に30mmまでの雨の中で使える。それより強い雨のときは、電源プラグを抜く。水没や冠水には耐えない。"}

