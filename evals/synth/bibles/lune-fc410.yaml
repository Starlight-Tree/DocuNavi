# リューネ工房 荷運び浮上カート FC-410（架空。無人の近距離運搬）の共通設定。2026-11-19 に新しく作った。
# 事実（facts）にある数値・日付・時刻だけが、生成した本文に出てよい。足す・直すと version が変わる。
