premise: リューネ工房の荷運び浮上カート FC-410（無人の近距離運搬。積載量35kg）。ドーム都市の家庭で、家と庭、近所の店のあいだの荷物の運搬に使う。問い合わせ先は、リューネサポートセンターと、お買い上げの販売店。
contacts: []
forbidden: [パナソニック, 日立, シャープ, 東芝, ダイソン, アイリスオーヤマ, ザーハード, 砂漠, 荒野, 酸素, 遺跡, 洗濯]
extra_numbers: []

facts:
  - {id: capacity, tags: [core, safety, spec, run], text: "荷台に積める荷物の重さは、原則として35kgまで。荷物は荷台の中央に置き、重い物を下にする。片寄って積むと、カートが傾いて走れなくなる。"}
  - {id: overview, tags: [core, run], text: "荷運び浮上カート FC-410は、家と庭、近所の店のあいだで荷物を運ぶ、無人のカート。歩く速さで浮いて走り、手元のリモコンで操作する。"}
  - {id: modes, tags: [core, run, quick], text: "運転のモードは3つある。「おともモード」は持ち主についてくる。「おつかいモード」は、登録した2か所のあいだを往復する。「手動モード」は、リモコンの操作レバーで操縦する。"}
  - {id: emergency-stop, tags: [core, safety, run, quick], text: "リモコンの非常停止ボタンを押すと、カートはすぐに浮上を止めて、その場で着地する。運転中は、非常停止ボタンにいつでも指が届く持ち方をする。"}
  - {id: no-riding, tags: [safety], text: "人やペットを荷台に乗せない。荷台に座ったり、立ったりもしない。お子さまが近くにいるときは、カートから目を離さない。"}
  - {id: flammable, tags: [safety], text: "ガソリンや灯油などの引火性の液体と、圧縮ガスのボンベは、荷として積まない。火災の原因になる。"}
  - {id: step-limit, tags: [safety, run, spec], text: "越えられる段差は、高さ45mmまで。それを超える段差の手前では、カートが自動で止まる。階段や側溝のそばでは使わない。"}
  - {id: rain, tags: [safety, run], text: "雨のときは、1時間の雨量が5mm以下の小雨だけ、走らせてよい。それを超える雨や、水たまりのある路面では走らせない。"}
  - {id: strap, tags: [safety, run, install], text: "荷物は、付属の固定ベルト2本を、荷台の4か所のフックに掛けて固定する。固定しないと、走行中に荷崩れする。1本のベルトで支えられる重さは20kgまでで、ベルトの長さは約1.8m。"}
  - {id: sensor-stop, tags: [safety, run, quick], text: "前方の人や物に近づくと、約1.2m手前から自動で減速し、約0.4mで止まる。路面センサーの窓が汚れていると、検知が弱くなる。"}
  - {id: remote-disconnect, tags: [safety, run, spec, error], text: "リモコンが届くのは、カートから約50mまで。リモコンとの通信が3秒間途切れると、カートはその場で止まって着地する。リモコンの表示にC04が出るので、リモコンに近づいてから操作をやり直す。"}
  - {id: night, tags: [safety, run], text: "夕方や暗い場所では、前のライトを点灯して使う。後ろの反射板に、荷物や布をかぶせない。"}
  - {id: battery-safety, tags: [safety, care], text: "バッテリーは、分解しない。水にぬらさず、落としたり、ぶつけたりしない。膨らんだり、熱くなったりしたときは使わず、お買い上げの販売店に連絡する。"}
  - {id: steps, tags: [run, quick], text: "基本の手順は、バッテリーを取り付け、荷物を荷台に載せて固定ベルトで留め、電源ボタンを押し、リモコンでモードを選び、スタートボタンを押す。"}
  - {id: power-on, tags: [run, quick], text: "電源ボタンを2秒間押すと、カートが起動して浮上の準備を始める。リモコンの表示灯が緑になれば、操作できる。"}
  - {id: manual-mode, tags: [run, quick], text: "手動モードでは、操作レバーを倒した方向へカートが進む。レバーを離すと、カートはその場で止まる。"}
  - {id: follow-mode, tags: [run, quick], text: "おともモードは、リモコンを持った持ち主の約1.5m後ろをついてくる。持ち主が立ち止まると、カートも止まる。リモコンの切り替えボタンで、モードに入る。"}
  - {id: errand-mode, tags: [run, quick], text: "おつかいモードは、登録した2か所のあいだを、片道が400mまでの経路で往復する。到着すると、荷降ろしを待って止まる。"}
  - {id: errand-wait, tags: [run], text: "おつかいモードで到着したあと、荷降ろしがされないまま10分たつと、カートがブザーで知らせる。荷物を降ろして、リモコンの往復ボタンを押すと、元の地点へ戻る。"}
  - {id: register-spot, tags: [run, quick], text: "おつかいモードの地点は、カートを目的の場所に置き、リモコンの登録ボタンを5秒間押して登録する。登録できるのは2か所だけで、登録しなおすと前の地点は消える。"}
  - {id: parking, tags: [run, quick], text: "止めるときは、リモコンの着地ボタンを押す。浮上が止まり、脚が降りて機体が固定される。荷物は、着地したあとに降ろす。"}
  - {id: battery-meter, tags: [run, quick], text: "バッテリーの残量は、カート本体の表示灯と、リモコンの表示で確かめられる。表示は4段階で、1つになったら、すぐに充電する。"}
  - {id: hover-height, tags: [run, spec], text: "浮上高は約60mm。荷物が重いと、浮上高が少し下がる。"}
  - {id: range, tags: [run, spec], text: "1回の充電で走れる距離は、荷物が満載のとき約9km、荷物が軽いとき約14km。"}
  - {id: size, tags: [spec], text: "外形寸法は、幅760mm、奥行き1,120mm、高さ540mm。質量は、バッテリーを含めて約48kg。荷台の内寸は、幅700mm、奥行き850mmで、側板の高さは280mm。"}
  - {id: speeds, tags: [spec], text: "走行速度は、手動モードが最高5km/h、おともモードが約4km/h、おつかいモードが約3.5km/h。運転音は約46dB。"}
  - {id: battery, tags: [spec], text: "バッテリーは、着脱式のリチウムイオン電池で、定格電圧は36V。質量は約3.2kg。走行中の消費電力は約180W。"}
  - {id: sensors, tags: [spec, run], text: "路面センサーは、荷台の前後に合わせて4個ある。検知できる距離は約2.5m。センサーの窓は、機体の前後の下側にある。"}
  - {id: temp, tags: [install, spec], text: "カートを使える周囲温度は、0℃から38℃まで。この範囲を超える場所では、走らせない。"}
  - {id: unpack, tags: [install], text: "箱から出したら、付属品を確かめる。付属品は、リモコン、固定ベルト、充電アダプター、側板、ネジ、六角レンチ、取扱説明書、保証書。荷台の前後の路面センサーの窓に付いた保護フィルムは、はがす。側板は、六角レンチで荷台の四方に取り付ける。"}
  - {id: place, tags: [install], text: "保管と充電の場所は、水平で屋根のある場所にする。カートの周りに、幅1,000mm以上の空間を空ける。"}
  - {id: outdoors, tags: [install], text: "充電は、必ず屋内で行う。雨や水がかかる場所、直射日光が当たる場所には、カートを置かない。"}
  - {id: power, tags: [install, spec], text: "充電アダプターは、交流100Vのコンセントにつなぐ。コンセントは、定格6A以上のものを使う。"}
  - {id: first-charge, tags: [install, run], text: "初めて使う前に、バッテリーを充電する。空の状態から満充電まで、約5時間かかる。"}
  - {id: battery-attach, tags: [install, run], text: "バッテリーは、荷台の後ろ側の収納部に差し込み、カチッと音がするまで押し込む。外すときは、ロックレバーを引きながら引き抜く。"}
  - {id: pairing, tags: [install, run], text: "リモコンとカートは、工場出荷時に登録済み。登録が外れたときは、カートの電源を入れてから、リモコンの電源ボタンを8秒間押して、登録しなおす。"}
  - {id: ground, tags: [install], text: "置き場は、傾きのない面にする。傾きのある所では、着地中にカートが動き出すことがある。"}
  - {id: spot-survey, tags: [install, run], text: "おつかいモードで使う経路は、先に歩いて確かめる。経路の幅は、800mm以上必要。"}
  - {id: route-rule, tags: [install, safety], text: "走らせる場所は、お住まいの区域の機体通行の決まりを確かめる。歩行者用の通路と、私有地の中だけで使う。"}
  - {id: remote-batt, tags: [install, care], text: "リモコンには、単4形の乾電池を2本入れる。+と-の向きを確かめる。乾電池は付属していない。"}
  - {id: sensor-clean, tags: [care], text: "路面センサーの窓は、走行のあと、毎回、乾いた柔らかい布で拭く。汚れが残ると、C03のエラーの原因になる。"}
  - {id: filter, tags: [care], text: "浮上口の吸気フィルターは、2週間に1回、取り出してごみを取り除く。水洗いしたときは、完全に乾いてから戻す。"}
  - {id: bed-clean, tags: [care], text: "荷台は、水で薄めた中性洗剤を含ませた布で拭く。シンナーやベンジンは使わない。"}
  - {id: body-wipe, tags: [care], text: "機体の外側は、柔らかい布で水拭きする。高圧の水を当てて洗わない。"}
  - {id: strap-check, tags: [care], text: "固定ベルトは、半年に1回、ほつれや金具の変形がないかを確かめる。傷んでいるときは、使わずに、お買い上げの販売店で新しいものを求める。"}
  - {id: pad, tags: [care], text: "機体の下面にある浮上パッドは、1か月に1回、傷や汚れを見る。すり減ったときは、お買い上げの販売店に交換を依頼する。"}
  - {id: battery-care, tags: [care], text: "バッテリーは、残量表示が1つになる前に充電すると、長持ちする。使い終わったら、毎回、充電する。"}
  - {id: remote-care, tags: [care], text: "リモコンは、乾いた布で拭く。乾電池は、1年に1回、新しいものに替える。長期間使わないときは、乾電池を抜く。"}
  - {id: never-wash, tags: [care, safety], text: "カートを水に浸さない。下面や荷台の隙間に、水を流し込まない。"}
  - {id: after-rain, tags: [care], text: "雨に濡れたあとは、乾いた布で水を拭き、屋内で乾かしてから充電する。"}
  - {id: dont-disassemble, tags: [care, safety], text: "お手入れのときに、カートを分解したり、浮上口に油を差したりしない。金属のたわしや、研磨剤の入った洗剤も使わない。"}
  - {id: storage, tags: [care, install], text: "長期間使わないときは、バッテリーを半分ほど充電してから外し、涼しい屋内に置く。3か月に1回、残量を確かめて、充電する。"}
  - {id: charge-temp, tags: [care, install], text: "充電は、周囲温度が10℃から30℃のときに行う。冷えたままのときは、室温に40分置いてから充電する。"}
  - {id: c01, tags: [error], text: "C01はバッテリーエラーで、主な原因はバッテリーの残量不足。対処の目安は約90分。"}
  - {id: c02, tags: [error], text: "C02は荷台エラーで、主な原因は荷物の片寄りや積みすぎ。対処の目安は約3分。"}
  - {id: c03, tags: [error], text: "C03はセンサーエラーで、主な原因は路面センサーの窓の汚れ。対処の目安は約10分。"}
  - {id: c04, tags: [error], text: "C04は通信エラーで、主な原因はリモコンの乾電池切れや、カートから離れすぎたこと。対処の目安は約15分。"}
  - {id: c05, tags: [error], text: "C05は浮上エラーで、主な原因は路面の凹凸や水たまり、吸気フィルターのつまり。対処の目安は約25分。"}
  - {id: c06, tags: [error], text: "C06は温度エラーで、主な原因はバッテリーの温度が上がりすぎたこと。直射日光の当たる場所から日陰に移し、対処の目安は約45分。"}
  - {id: c07, tags: [error], text: "C07は駆動エラーで、主な原因は過負荷や部品の故障。修理が必要。"}
  - {id: not-float, tags: [error], text: "カートが浮かないときは、バッテリーが奥まで入っているか、荷物が限度を超えていないかを確かめる。"}
  - {id: no-follow, tags: [error], text: "おともモードでついてこないときは、リモコンの乾電池が切れていないか、リモコンを持った持ち主が離れすぎていないかを確かめる。"}
  - {id: no-errand, tags: [error], text: "おつかいモードで往復しないときは、2か所の地点が登録されているか、経路に障害物がないかを確かめる。"}
  - {id: restart, tags: [error], text: "エラーが出たときは、まず着地ボタンを押して着地させる。電源を切り、約20秒待ってから、入れ直す。"}
  - {id: blackout, tags: [error], text: "停電や、充電中のコンセント抜けのあとは、運転が途中から再開されないことがある。その場合は、カートが着地していることを確かめてから、電源を入れ直し、もう一度スタートボタンを押す。"}
  - {id: contact, tags: [error, warranty], text: "対処しても直らないときは、バッテリーを外し、お買い上げの販売店かリューネサポートセンターに連絡する。連絡のときは、型番と製造番号を知らせる。製造番号は、機体の銘板に書かれている。"}
  - {id: warranty, tags: [warranty], text: "保証期間は、お買い上げの日から1年間。ただし、バッテリーは、お買い上げの日から3年間保証する。バッテリーの保証は、一般の家庭で使った場合に限り、業務用に使った場合は1年間。"}
  - {id: home-use, tags: [warranty], text: "FC-410は、ドーム都市の家庭で、家と庭、近所の店のあいだの荷物を運ぶための製品。商売で使う場合は、業務用として扱う。"}
  - {id: exclusions, tags: [warranty], text: "次の場合は、保証期間内でも、保証の対象にならない。浮上パッドのすり減り、固定ベルトや乾電池などの消耗品、落下や水没による故障、取扱説明書に従わない使い方、お客さまによる分解や改造。"}
  - {id: liability, tags: [warranty], text: "運搬中の荷物の破損や紛失による損害は、保証の対象にならない。"}
  - {id: visit-fee, tags: [warranty], text: "出張修理の費用は、保証期間内は無料。保証期間を過ぎた場合は、出張料が3,300円かかる。"}
  - {id: parts, tags: [warranty], text: "補修用の部品は、製造を打ち切ってから7年間保有する。"}
  - {id: support, tags: [warranty], text: "リューネサポートセンターの受付時間は、月曜日から金曜日の午前9時から午後6時まで。土曜日、日曜日、祝日はお休み。"}
  - {id: disposal, tags: [warranty], text: "本体を廃棄するときは、お住まいの区域の機体処理規則の対象になる。お買い上げの販売店に、引き取りを依頼する。"}
  - {id: warranty-card, tags: [warranty], text: "保証書は、お買い上げの販売店が、販売店名と日付を記入して渡す。保証書は、再発行しない。"}
  - {id: apply-steps, tags: [warranty], text: "保証を受けるときは、保証書を用意して、型番、製造番号、症状を知らせる。出張修理の訪問日は、受付のときに案内する。"}
  - {id: serial-location, tags: [warranty], text: "製造番号が書かれた銘板は、荷台の後ろ側の下面にある。"}
  - {id: repair-warranty, tags: [warranty], text: "修理した部分の保証は、修理を終えた日から90日間。交換した部品は、お返しせず、リューネ工房が回収する。"}
  - {id: not-documented, tags: [warranty], text: "延長保証の料金、保証期間を過ぎたバッテリーの交換の部品代、修理中の代わりの機体の貸し出しについては、定められていない。"}

