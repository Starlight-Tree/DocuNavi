# ザーハード大学（架空）の共通設定。既存の資料 evals/corpora/guides/source/tsubasa_dorm_rules.md（学生寮の入寮規程。大学の資料 1 冊に数える）と矛盾しないように起こした。2026-11-19 に、つばさ大学の学生寮から書き換えた（対象名 tsubasa-dorm は変えない）。同日、合成の資料を 19 件の寮の資料から 4 冊（学則・入学案内・学費と奨学金・防災と安全。1 冊 4,500〜7,500 文字）へ置き換え、事実を足した。
# 事実（facts）にある数値・日付・時刻だけが、生成した本文に出てよい。足す・直すと version が変わる。
target: tsubasa-dorm
label: ザーハード大学
existing_documents: 1
documents: 5
revision: 2026年11月1日改訂
premise: ザーハード大学は、アルカ市の遺跡エリアにキャンパスがある大学で、環境工学部と文化資源学部、大学院を置く。学生寮は居住区にあり、ひばり棟・つばめ棟・かもめ棟の 3 棟でできている。運営は学生支援課が行い、各棟に寮監が 1 名いる。
contacts: []
forbidden: [東京大学, 早稲田, 慶應, 京都大学, 文部科学省, ザーハリアン]
extra_numbers: []

facts:
  # 入寮規程の事実（承認済み。id・本文は変えない）
  - {id: scope, tags: [core, overview], text: "ザーハード大学学生寮（以下「寮」という。）は、ひばり棟、つばめ棟及びかもめ棟の3棟で構成する。"}
  - {id: capacity, tags: [core, overview, apply], text: "各棟の定員は、ひばり棟が120名、つばめ棟が100名、かもめ棟が60名。"}
  - {id: operation, tags: [core, overview], text: "寮の運営は、学生支援課が行う。各棟には、寮監を1名置く。"}
  - {id: eligible, tags: [apply], text: "入寮できる者は、本学の学部学生で、自宅から本学までの通学時間が片道90分以上のもの。大学院生は、通学時間にかかわらず入寮を申し込める。"}
  - {id: apply-deadline, tags: [apply], text: "入寮の申込みは、入寮を希望する年度の2月28日までに、学生支援課へ申込書を提出して行う。"}
  - {id: apply-late, tags: [apply], text: "申込みの期限を過ぎた申込みは、空きがある場合に限り、4月10日まで受け付ける。"}
  - {id: apply-docs, tags: [apply], text: "申込書には、住民票の写し1通と、保護者の同意書を添える。"}
  - {id: result-date, tags: [apply], text: "入寮の可否は、3月10日までに通知する。"}
  - {id: room-lottery, tags: [apply, life], text: "居室は、抽選で割り当てる。ただし、車いすを使う者には、1階の居室を優先して割り当てる。"}
  - {id: move-in, tags: [apply], text: "入寮日は4月1日。ただし、遠方からの入学者は、3月28日から入寮できる。"}
  - {id: period, tags: [apply, overview], text: "入寮期間は1年。入寮期間は更新でき、更新は2回までなので、最長で3年間入寮できる。"}
  - {id: renew, tags: [apply], text: "更新を希望する者は、入寮期間が満了する年の12月20日までに申請する。"}
  - {id: leave-of-absence, tags: [apply, moveout], text: "休学する者は、休学の開始日までに退寮する。ただし、病気のため休学する者は、学生支援課長の許可を受けて、入寮を続けることができる。許可を受けた場合も、休学中の寮費は、全額を納める。"}
  - {id: fee-room, tags: [fee], text: "寮費は月額で、ひばり棟の個室は38,000円、つばめ棟の二人部屋は1人につき24,000円、かもめ棟の個室は45,000円。"}
  - {id: fee-common, tags: [fee], text: "共益費は月額6,500円で、棟にかかわらず同額。居室の電気料金は共益費に含まれず、居室ごとのメーターの値に応じて請求する。"}
  - {id: fee-pay, tags: [fee], text: "寮費及び共益費は、毎月25日までに、翌月分を納める。納入が2か月続けて遅れたときは、退寮を命じることがある。"}
  - {id: deposit, tags: [fee, moveout], text: "入寮する者は、入寮時に保証金50,000円を納める。保証金は退寮時に返還するが、修繕や清掃に要した費用は差し引く。"}
  - {id: fee-moveout, tags: [fee, moveout], text: "退寮する月の寮費は、原則として全額。ただし、月の15日までに退寮したときは半額。"}
  - {id: fee-relief, tags: [fee], text: "経済的な理由により納入が困難な者には、学生支援課長は寮費の3割を減免できる。申請は毎年5月31日まで。"}
  - {id: curfew, tags: [life], text: "門限は、午後11時。ただし、実習やアルバイトのため帰寮が遅れる者は、前日までに届け出れば午前0時まで認める。"}
  - {id: overnight, tags: [life], text: "外泊は、前日までに寮監へ届け出る。連続して7日を超える外泊は、事前に学生支援課の許可を受ける。"}
  - {id: visitors, tags: [life], text: "来訪者は、午前9時から午後8時までの間に限り、共用の談話室で面会できる。来訪者を居室に入れてはならない。"}
  - {id: appliances, tags: [life, safety], text: "居室の電気器具の消費電力は、合計1,200W以内。火気を使う調理器具は持ち込めない。"}
  - {id: laundry, tags: [life], text: "共用の洗濯室は、午前7時から午後10時まで使える。午後10時以降は静かにする。"}
  - {id: cleaning, tags: [life], text: "共用部分の清掃は、階ごとの当番制で週1回行う。"}
  - {id: drill, tags: [safety], text: "避難訓練は、毎年4月と10月に行う。"}
  - {id: moveout-notice, tags: [moveout], text: "退寮するときは、退寮予定日の30日前までに、退寮届を学生支援課へ提出する。"}
  - {id: moveout-day, tags: [moveout], text: "退寮日の午前10時までに、居室を清掃して寮監に明け渡す。"}
  - {id: key-lost, tags: [moveout, safety, life], text: "鍵を紛失したときは、直ちに寮監へ届け出る。"}
  - {id: violation, tags: [safety, life], text: "規程に違反した者には、警告を行う。警告を3回受けた者には、退寮を命じる。"}
  - {id: effective, tags: [overview], text: "入寮規程は、2026年4月1日から施行している。"}
  - {id: not-documented, tags: [overview, life], text: "共用洗濯室の使用料、食事の料金、ペットの可否は、定められていない。"}

  # 世界の共通設定（5 校すべてで同じ。id と本文は変えない）
  - {id: world-city, tags: [core], text: "この学校は、アルカ市にある。アルカ市は、居住区・発着場・岩山・遺跡の 4 つのエリアに分かれている。"}
  - {id: world-air, tags: [core], text: "この星の厳しい環境に合わせて、校舎のすべての部屋に、空気を整える設備を備えている。校舎の中では、マスクなしで過ごせる。"}
  - {id: world-chain, tags: [core], text: "ほしぞら幼稚園、アルカ第一小学校、アルカ中央中学校、オアシス高等学校、ザーハード大学は、アルカ市の学校の並びで、進学の道がつながっている。"}

  # 学則
  - {id: r-purpose, tags: [rules, overview], text: "この学則は、ザーハード大学（以下「本学」という。）の目的、組織、修業年限、学期、単位、成績、休学、退学その他の学生に関する事項を定める。"}
  - {id: r-aim, tags: [rules, overview], text: "本学は、アルカ市の環境に根ざした工学と、居住区の暮らしや遺跡の研究を通じて、地域に貢献できる人材を育てることを目的とする。"}
  - {id: r-faculty, tags: [rules, overview], text: "本学に、環境工学部と文化資源学部を置く。環境工学部には環境システム学科と建築居住学科を、文化資源学部には遺跡調査学科と地域文化学科を置く。"}
  - {id: r-grad, tags: [rules, overview], text: "本学に、環境工学と文化資源の両分野を学ぶ大学院を置く。大学院の課程は修士課程で、標準修業年限は2年。"}
  - {id: r-years, tags: [rules], text: "学部の修業年限は4年。在学できる年数は、休学の期間を除き、8年までとする。"}
  - {id: r-term, tags: [rules], text: "学年は、4月に始まり、翌年の3月に終わる。学年を、前期（4月から9月まで）と後期（10月から翌年の3月まで）に分ける。"}
  - {id: r-credit, tags: [rules], text: "1単位は、45時間の学修を必要とする内容で構成する。授業の時間は、講義が15時間、演習が30時間、実習が45時間をもって1単位とする。"}
  - {id: r-credit-total, tags: [rules], text: "学部を卒業するために必要な単位は、124単位以上。1年間に履修登録できる単位は、原則として44単位まで。"}
  - {id: r-grades, tags: [rules], text: "成績は、秀・優・良・可・不可の5段階で評価する。秀は90点以上、優は80点以上、良は70点以上、可は60点以上、不可は60点未満とし、可以上を合格として単位を与える。"}
  - {id: r-attendance, tags: [rules], text: "授業を欠席した回数が、その科目の授業回数の3分の1を超えた者は、その科目の試験を受けられない。"}
  - {id: r-retake, tags: [rules], text: "病気や災害などやむを得ない理由で試験を受けられなかった者は、試験の日から7日以内に、追試験を願い出ることができる。"}
  - {id: r-leave, tags: [rules], text: "病気その他の理由で3か月以上修学できない者は、学長の許可を受けて休学できる。休学の期間は、1回につき1年以内とし、通算して2年を超えられない。"}
  - {id: r-leave-apply, tags: [rules], text: "休学を願い出る者は、休学を始める日の14日前までに、休学願を学務課へ提出する。"}
  - {id: r-leave-dorm, tags: [rules, fee], text: "寮に入っている者が休学するときは、入寮規程の定めに従う。休学中の授業料は、4分の1の額とし、施設費は全額を納める。"}
  - {id: r-withdraw, tags: [rules], text: "退学しようとする者は、退学願を学長へ提出して許可を受ける。退学した者が再び入学を願い出たときは、教授会の審議を経て、許可することがある。"}
  - {id: r-expel, tags: [rules], text: "在学できる年数を超えた者と、休学の期間の上限を超えた者は、除籍とする。"}
  - {id: r-expel-fee, tags: [rules, fee], text: "授業料を、督促を受けても6か月を超えて納めない者は、除籍とする。"}
  - {id: r-graduate, tags: [rules], text: "卒業は、4年以上在学し、卒業に必要な単位を修得した者に認める。卒業した者には、学士の学位を授与する。"}
  - {id: r-office, tags: [rules, admit], text: "履修・成績・休学・退学の窓口は、学務課。学生の生活や相談の窓口は、学生支援課。"}
  - {id: r-effective, tags: [rules, overview], text: "この学則は、2026年4月1日から施行している。改正は、教授会の審議を経て、学長が行う。"}
  - {id: r-not-documented, tags: [rules, overview], text: "他の大学との単位の互換、補講の回数、卒業論文の字数は、定められていない。"}

  # 入学案内
  - {id: a-campus, tags: [admit, overview], text: "本学のキャンパスは、アルカ市の遺跡エリアにある。通学には、発着場から出る乗り合い便を使う。"}
  - {id: a-quota, tags: [admit], text: "学部の入学定員は、環境システム学科が80名、建築居住学科が60名、遺跡調査学科が40名、地域文化学科が40名で、合計220名。"}
  - {id: a-grad-quota, tags: [admit], text: "大学院の入学定員は、20名。"}
  - {id: a-types, tags: [admit], text: "入学者の選抜は、推薦選抜と一般選抜の2種類を行う。"}
  - {id: a-rec-schedule, tags: [admit], text: "推薦選抜は、出願が10月1日から10月15日まで、試験が11月10日、合格発表が12月1日。"}
  - {id: a-gen-schedule, tags: [admit], text: "一般選抜は、出願が1月5日から1月20日まで、試験が2月1日、合格発表が2月10日。"}
  - {id: a-eligible, tags: [admit], text: "出願できる者は、学校教育の12年の課程を修了した者（修了の見込みの者を含む。）と、これと同等以上の学力があると認められた者。"}
  - {id: a-exam-fee, tags: [admit, fee], text: "検定料は、1学科につき25,000円。推薦選抜と一般選抜の両方に出願するときは、あわせて40,000円。"}
  - {id: a-docs, tags: [admit], text: "出願には、入学願書、調査書、検定料の納入証明を提出する。入学願書には、顔写真1枚を貼る。"}
  - {id: a-subjects, tags: [admit], text: "一般選抜の試験科目は、数学・理科・国語の3科目で、試験の時間は科目ごとに80分。"}
  - {id: a-procedure, tags: [admit, fee], text: "合格した者は、合格発表の日から10日以内に入学手続を行う。期限までに入学金を納めない者は、入学を辞退したものとみなす。"}
  - {id: a-dorm, tags: [admit], text: "入寮を希望する者は、入学手続とは別に、入寮規程に従って学生支援課へ申し込む。"}
  - {id: a-ceremony, tags: [admit], text: "入学式は、4月3日の午前10時から行う。入学式の翌日の4月4日に、新入生のオリエンテーションを行う。"}
  - {id: a-class-start, tags: [admit], text: "前期の授業は、4月8日に始まる。履修登録は、4月15日までに行う。"}
  - {id: a-health, tags: [admit, safety], text: "新入生は全員、入学後に健康診断を受ける。結果について相談したい者は、保健室へ行く。"}
  - {id: a-support, tags: [admit], text: "障害や持病のある受験者は、出願の前に、入試事務室へ相談できる。配慮の内容は、相談のうえで決める。"}
  - {id: a-office, tags: [admit], text: "入学案内の問い合わせは、入試事務室が受け付ける。受付時間は、月曜日から金曜日の午前9時から午後5時まで。土曜日、日曜日、祝日はお休み。"}
  - {id: a-not-documented, tags: [admit, fee], text: "入学金の分割払いと、教科書代の目安は、定められていない。"}

  # 学費と奨学金
  - {id: f-admission, tags: [fee], text: "入学金は、学部が250,000円、大学院が200,000円。入学金は、入学手続のときに1回だけ納める。"}
  - {id: f-tuition, tags: [fee], text: "授業料は年額で、環境工学部が780,000円、文化資源学部が720,000円、大学院が640,000円。"}
  - {id: f-facility, tags: [fee], text: "施設費は年額で、学部・大学院とも120,000円。"}
  - {id: f-field, tags: [fee], text: "野外実習を行う科目では、1科目につき5,000円の実習費がかかる。実習費は、遺跡や岩山での調査にかける保険の費用にあてる。"}
  - {id: f-schedule, tags: [fee], text: "授業料と施設費は、前期分と後期分の2回に分けて納める。前期分は4月20日まで、後期分は10月20日まで。"}
  - {id: f-method, tags: [fee], text: "学費は、本学が指定する口座への振込で納める。窓口では、現金を受け取らない。"}
  - {id: f-install, tags: [fee], text: "経済的な理由で、2回の納入が難しい者は、授業料を年4回に分けて納められる。納める期限は、4月、7月、10月、1月の各月末。申請は、前期の納入期限の20日前までに、学務課へ行う。"}
  - {id: f-late, tags: [fee], text: "納入が期限に遅れそうなときは、期限の前に、学務課へ相談する。"}
  - {id: f-scholar-types, tags: [fee], text: "奨学金は、給付型と貸与型の2種類。給付型は、返還しなくてよい。貸与型は、卒業後に返還する。"}
  - {id: f-scholar-amount, tags: [fee], text: "給付型の奨学金は、月額30,000円で、学年ごとに20名に支給する。貸与型の奨学金は、月額50,000円まで借りられる。"}
  - {id: f-scholar-cond, tags: [fee], text: "給付型の奨学金を受けられる者は、前の学年の成績の平均が「良」以上で、経済的な理由で学費の納入が難しい者。"}
  - {id: f-scholar-apply, tags: [fee], text: "奨学金の申請は、毎年4月30日まで。申請書と、家計の状況を示す書類を、学生支援課へ提出する。"}
  - {id: f-exempt, tags: [fee], text: "本人の家計が急に変わったときや、災害にあったときは、授業料の減免を申請できる。減免の額は、授業料の半額までとする。"}
  - {id: f-refund, tags: [fee], text: "納めた授業料と施設費は、原則として返さない。ただし、前期の授業が始まる前に退学を願い出た者には、前期分を返す。"}
  - {id: f-refund-admission, tags: [fee], text: "入学金と検定料は、原則として返さない。"}
  - {id: f-receipt, tags: [fee], text: "学費の納入証明書が必要な者は、学務課へ申し込む。証明書は、申込みから3日で渡す。手数料はかからない。"}
  - {id: f-dorm, tags: [fee], text: "寮費は、学費とは別に納める。寮費の納め方は、入寮規程で定めている。"}
  - {id: f-textbook, tags: [fee], text: "教科書代は、学費に含まれない。授業ごとに、各自で買う。"}

  # 防災と安全
  - {id: s-purpose, tags: [safety, overview], text: "防災・安全のしおりは、学生と教職員が、校舎とキャンパスで安全に過ごすための決まりをまとめたもの。担当は、学生支援課。"}
  - {id: s-drill, tags: [safety], text: "全学の避難訓練は、毎年4月と10月の年2回行う。所要時間は約40分で、学生は全員参加する。"}
  - {id: s-drill-route, tags: [safety], text: "避難の経路は、各教室の出入口に掲示している。訓練では、校舎の外の集合場所まで歩く。"}
  - {id: s-drill-absent, tags: [safety], text: "避難訓練に参加できなかった者は、1週間以内に学生支援課へ連絡し、避難の経路の説明を受ける。"}
  - {id: s-air-system, tags: [safety], text: "空気を整える設備は、教室、研究室、廊下、食堂など、校舎のすべての部屋にある。設備の点検は、施設課が月に1回行う。"}
  - {id: s-air-alarm, tags: [safety], text: "設備に異常があると、部屋の入口の表示灯が黄色に変わる。表示灯が黄色になったら、近くの職員に知らせる。"}
  - {id: s-air-stop, tags: [safety], text: "設備が止まったときは、職員の案内に従って、隣の建物へ移る。移るときのために、携帯用のマスクを各階に備えている。"}
  - {id: s-air-outdoor, tags: [safety], text: "校舎の外へ出る授業や実習では、マスクを着ける。マスクは、学生支援課で貸し出す。"}
  - {id: s-fieldwork, tags: [safety, rules], text: "遺跡や岩山での野外実習は、教員が引率し、1回の参加人数は25名までとする。出発の前に、集合場所で人数と装備を確かめる。"}
  - {id: s-fieldwork-weather, tags: [safety], text: "野外実習の日に、風が強いときや視界が悪いときは、実習を中止して、教室で代わりの授業を行う。"}
  - {id: s-injury, tags: [safety], text: "校舎の中でけがをしたときは、すぐ近くの職員に知らせる。軽いけがは、保健室で手当てを受けられる。"}
  - {id: s-health-room, tags: [safety], text: "保健室は、校舎の1階にある。開室時間は、月曜日から金曜日の午前8時30分から午後5時30分まで。"}
  - {id: s-emergency, tags: [safety], text: "重いけがや急な病気のときは、近くの教職員に知らせ、救急の連絡を頼む。学生どうしで、自分たちの判断で運ばない。"}
  - {id: s-report, tags: [safety], text: "けがや事故があったときは、5日以内に、事故報告書を学生支援課へ提出する。"}
  - {id: s-notice, tags: [safety], text: "災害や緊急のときは、本学の一斉連絡の仕組みで、全学生に知らせる。学生は、入学手続のときに、連絡を受ける方法を登録する。"}
  - {id: s-office, tags: [safety], text: "学生支援課の窓口は、月曜日から金曜日の午前9時から午後6時まで。時間外の緊急のときは、守衛室に知らせる。守衛室には、24時間、人がいる。"}
  - {id: s-evacuate, tags: [safety], text: "災害で避難の放送が流れたときは、荷物を持たずに、経路の掲示に従って外へ出る。エレベーターは使わない。"}
  - {id: s-assembly, tags: [safety], text: "避難したあとは、学科ごとの集合場所に集まり、点呼を受ける。点呼が終わるまで、集合場所を離れない。"}
  - {id: s-fire, tags: [safety], text: "校舎で火を使えるのは、実験室と調理実習室だけ。ほかの部屋に、火気を持ち込まない。"}
  - {id: s-lab, tags: [safety], text: "実験室では、保護めがねと手袋を着ける。薬品は、教員の許可なく持ち出さない。"}
  - {id: s-lost, tags: [safety], text: "鍵や学生証をなくしたときは、直ちに学生支援課へ届け出る。"}
  - {id: s-not-documented, tags: [safety], text: "部屋ごとの避難人数の上限と、携帯用のマスクの枚数は、定められていない。"}

