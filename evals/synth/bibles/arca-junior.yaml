# アルカ中央中学校（架空。アルカ市の居住区エリアにある市立の中学校）の共通設定。2026-11-19 に新しく作った。アルカ市の学校の並び（ほしぞら幼稚園・アルカ第一小学校・アルカ中央中学校・オアシス高等学校・ザーハード大学）の 1 校。
# 事実（facts）にある数値・日付・時刻だけが、生成した本文に出てよい。足す・直すと version が変わる。
