    outline: [このご案内について, 費用の種類, 納め方, 減免と支援, 返金]
    style: ご案内の文体（です・ます）。費用は表で示してよい。
  - id: school-life
    doc_type: manual
    title: "{label} 学校生活のしおり"
    tags: [life]
