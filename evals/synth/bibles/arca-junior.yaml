existing_documents: 0
documents: 5
revision: 2026年11月1日改訂
premise: アルカ市の居住区エリアにある市立の中学校、アルカ中央中学校（1 年生から 3 年生）。部活動、制服、定期テスト、高校進学の相談、学費と給食費、入学の手続き、行事（岩山での校外学習など）、安全について、生徒と保護者に案内する。問い合わせ先は、学校の事務室。
contacts: []
forbidden: [東京大学, 早稲田, 慶應, 京都大学, 文部科学省, ザーハリアン]
extra_numbers: []

facts:
  - {id: world-city, tags: [core], text: "この学校は、アルカ市にある。アルカ市は、居住区・発着場・岩山・遺跡の 4 つのエリアに分かれている。"}
  - {id: world-air, tags: [core], text: "この星の厳しい環境に合わせて、校舎のすべての部屋に、空気を整える設備を備えている。校舎の中では、マスクなしで過ごせる。"}
  - {id: world-chain, tags: [core], text: "ほしぞら幼稚園、アルカ第一小学校、アルカ中央中学校、オアシス高等学校、ザーハード大学は、アルカ市の学校の並びで、進学の道がつながっている。"}
  - {id: school-name, tags: [core], text: "学校の名前は、アルカ中央中学校。アルカ市が設置する市立の中学校で、居住区エリアにある。"}
  - {id: grades, tags: [core], text: "生徒は、1 年生から 3 年生まで。修業年限は 3 年で、学年は 4 月 1 日に始まり、翌年の 3 月 31 日に終わる。"}
  - {id: capacity, tags: [core, admit], text: "定員は、1 学年が 4 クラスで、1 クラス 35 名。全校の定員は 420 名。"}
  - {id: location, tags: [core, life], text: "校舎は、居住区エリアの中央にある公園の北側にある。最寄りの発着場は居住区発着場で、そこから乗り合い便で通う生徒が多い。"}
  - {id: office, tags: [core], text: "事務室の受付時間は、月曜日から金曜日の午前 8 時から午後 4 時 45 分まで。土曜日、日曜日、祝日は休み。"}

  - {id: gate, tags: [rules], text: "校門は、午前 7 時 50 分に開き、午前 8 時 20 分に閉まる。閉まったあとに登校した生徒は、事務室に寄る。"}
  - {id: late, tags: [rules], text: "遅刻した生徒は、事務室で遅刻届を書き、担任の許可を受けてから教室に入る。遅刻が 1 か月に 3 回を超えたときは、保護者に連絡する。"}
  - {id: absent, tags: [rules], text: "欠席するときは、保護者が、当日の午前 8 時 5 分までに、学校の連絡システムか事務室で伝える。連絡のない欠席は、学校から保護者に確認する。"}
  - {id: infection-permit, tags: [rules, safety], text: "感染症で休んだときは、登校を再開する前に、医師が書いた登校許可の証明書を、担任に出す。"}
  - {id: uniform, tags: [rules], text: "登下校と学校行事では、指定の制服を着る。夏服は 6 月 1 日から 9 月 30 日まで、冬服は 10 月 1 日から 5 月 31 日まで着る。"}
  - {id: uniform-change, tags: [rules], text: "衣替えの前後の 2 週間は、夏服と冬服のどちらを着てもよい。制服の上着の下に着る物は、無地のものにする。"}
  - {id: appearance, tags: [rules], text: "髪を染めたり、アクセサリーを着けたりして登校してはならない。化粧もしない。"}
  - {id: phone, tags: [rules], text: "携帯端末は、学校へ持ってきてよい。ただし、校内では電源を切り、かばんにしまう。授業中に使ったときは、担任がその日の下校まで預かる。"}
  - {id: exam-conduct, tags: [rules], text: "定期テストで不正をした生徒は、その教科を 0 点とし、保護者に連絡する。テスト中は、携帯端末と学習用端末を、かばんにしまう。"}
  - {id: exam-makeup, tags: [rules], text: "病気などで定期テストを受けられなかった生徒は、テストの日から 1 週間以内に、追試を受けられる。追試を受けるには、保護者が事務室に申し出る。"}
  - {id: club-join, tags: [rules], text: "部活動には、原則として全員が入る。家庭の事情などで入らないときは、担任に届ける。"}
  - {id: club-list, tags: [rules], text: "部活動は、運動部 7 つと文化部 6 つ。運動部は、陸上部、バスケットボール部、バレーボール部、卓球部、サッカー部、テニス部、体操部。文化部は、吹奏楽部、美術部、科学部、書道部、図書部、放送部。"}
  - {id: club-time, tags: [rules], text: "部活動は、平日の放課後に、午後 4 時 30 分まで行う。11 月から 2 月は、午後 4 時までとする。土曜日と日曜日の活動は、合わせて月に 2 日まで。"}
  - {id: discipline, tags: [rules], text: "校則に反したときは、まず担任が生徒の話を聞き、改善を約束する。繰り返すときは、保護者を呼び、学年主任が面談する。体罰は行わない。"}
  - {id: bullying, tags: [rules, safety], text: "いじめを見たとき、受けたときは、すぐに担任か事務室に伝える。学校は、伝えた生徒の名前を、本人の同意なしに、ほかの生徒へ知らせない。"}

  - {id: eligible, tags: [admit], text: "入学できるのは、小学校を卒業する見込みの子どもで、アルカ市に住民登録がある者。居住区エリアに住む子どもは、原則として、この学校に入学する。"}
  - {id: other-area, tags: [admit], text: "居住区エリア以外に住む子どもが入学を希望するときは、指定校の変更を申請する。申請は、12 月 20 日までに、事務室へ出す。"}
  - {id: notice, tags: [admit], text: "入学の通知は、1 月 15 日に、保護者へ届く。通知が届かないときは、事務室に連絡する。"}
  - {id: briefing, tags: [admit], text: "入学説明会は、2 月 10 日の午後 2 時から、体育館で行う。保護者の参加は、1 家庭 2 名まで。"}
  - {id: care-consult, tags: [admit], text: "車いすを使う子どもや、健康上の配慮が必要な子どもは、1 月 31 日までに、事務室へ相談する。相談の内容は、担任になる教員と保健室だけで共有する。"}
  - {id: docs, tags: [admit], text: "入学までに出す書類は、入学届、住民票の写し 1 通、健康調査票、小学校の卒業見込みを示す書類。"}
  - {id: submit, tags: [admit], text: "書類は、2 月 28 日までに、事務室の窓口へ持ってくる。郵送では受け付けない。"}
  - {id: measure, tags: [admit], text: "制服の採寸は、2 月 22 日に、体育館で行う。受付は、午前 9 時から午後 3 時まで。"}
  - {id: withdraw, tags: [admit], text: "入学を辞退するときは、3 月 20 日までに、保護者が事務室へ申し出る。"}
  - {id: class-notice, tags: [admit], text: "クラスは、3 月 28 日に、学校の連絡システムで知らせる。クラスは、入学後に変えることがある。"}
  - {id: ceremony, tags: [admit, life], text: "入学式は、4 月 7 日の午前 10 時から、体育館で行う。保護者の参加は、1 家庭 2 名まで。"}
  - {id: first-days, tags: [admit], text: "4 月 8 日は、学年の集会と、教科書の配付を行う。授業は、4 月 9 日から始まる。教科書は、すべて無償で配る。"}
  - {id: transfer, tags: [admit], text: "年度の途中で転入するときは、事務室へ相談する。受け入れは、空きがあるクラスに限る。必要な書類は、住民票の写しと、前の学校の在学証明書。"}

  - {id: tuition-free, tags: [fee], text: "授業料は、無料。入学金も、取らない。"}
  - {id: materials, tags: [fee], text: "教材費は、年額 18,000 円。ワーク、ノート、実験や制作の材料の代金。前期と後期に、9,000 円ずつ分けて納める。"}
  - {id: lunch, tags: [fee], text: "給食費は、月額 4,800 円。8 月は給食がないので、納めなくてよい。"}
  - {id: lunch-credit, tags: [fee], text: "病気などで連続 5 日以上休み、前日の午後 3 時までに連絡があった給食は、1 食につき 240 円を、翌月の給食費から差し引く。"}
  - {id: trip-saving, tags: [fee], text: "修学旅行の費用は、1 年生の 4 月から 3 年生の 6 月まで、月額 5,000 円ずつ積み立てる。積立金は、学校の費用とは別に管理する。"}
  - {id: rock-fee, tags: [fee], text: "岩山での校外学習の費用は、1 回につき 1,500 円。乗り合い便を借り切る代金と、保険料を含む。"}
  - {id: club-fee, tags: [fee], text: "部活動費は、年額 6,000 円。道具やユニフォームの代金は、含まない。"}
  - {id: pe-clothes, tags: [fee], text: "体操服は、1 組 5,200 円。指定の販売店で買う。"}
  - {id: pay-date, tags: [fee], text: "給食費、積立金、保護者会費、部活動費は、毎月 20 日に、登録した口座から引き落とす。20 日が休みの日のときは、次の平日に引き落とす。"}
  - {id: pay-late, tags: [fee], text: "納入が 2 か月続けて遅れたときは、事務室が保護者に連絡し、支払いの相談に応じる。給食を止めることはない。"}
  - {id: support, tags: [fee], text: "経済的に困難な家庭には、市の就学援助がある。給食費と教材費の全額が対象で、申請は、毎年 4 月 30 日までに、事務室で受け付ける。"}
  - {id: refund-move, tags: [fee], text: "年度の途中で転出・退学するときは、納めた教材費のうち、使っていない分を、月割りで返す。給食費は、転出した月の翌月分から、返す。"}
  - {id: refund-trip, tags: [fee], text: "修学旅行に行けなくなったときは、積立金から、旅行会社に支払い済みの分を除いて、返す。"}
  - {id: refund-pay, tags: [fee], text: "返金は、申し出から 30 日以内に、登録した口座へ振り込む。"}
  - {id: not-documented, tags: [fee, rules], text: "制服の価格と、乗り合い便の定期の価格は、学校では定められていない。制服は、販売店ごとに価格が違う。"}

  - {id: daily, tags: [life], text: "朝の会は、午前 8 時 30 分に始まる。1 時間目は午前 8 時 50 分からで、授業は 1 コマ 50 分、1 日に 6 コマ。"}
  - {id: lunch-time, tags: [life], text: "給食は、4 時間目のあとの、午後 12 時 40 分から 45 分間。食べ終わったあとに、教室を掃除する。終礼は、午後 3 時 35 分に始まる。"}
  - {id: bus-in, tags: [life], text: "登校の乗り合い便は、居住区発着場から学校の前まで走る。学校の前には、午前 7 時 30 分から午前 8 時まで、10 分おきに着く。"}
  - {id: bus-out, tags: [life], text: "下校の乗り合い便は、午後 3 時 50 分から午後 6 時まで、20 分おきに、学校の前から居住区発着場へ出る。"}
  - {id: items, tags: [life], text: "毎日の持ち物は、教科書、ノート、筆記用具、学習用端末、水筒、ハンカチ、ティッシュ。持ち物には、名前を書く。"}
  - {id: allergy, tags: [life, safety], text: "食物アレルギーのある生徒は、4 月 20 日までに、アレルギー調査票を出す。給食は、調査票に合わせて、除いたものを出す。"}
  - {id: terms, tags: [life], text: "学期は 3 つ。1 学期は 4 月 7 日から 7 月 20 日、2 学期は 9 月 1 日から 12 月 22 日、3 学期は 1 月 8 日から 3 月 24 日まで。"}
  - {id: exam-schedule, tags: [life], text: "定期テストは、年に 4 回。5 月 20 日、7 月 8 日、11 月 18 日、2 月 17 日から、それぞれ 3 日間行う。教科は、国語・数学・理科・社会・英語の 5 つ。"}
  - {id: sports-day, tags: [life], text: "体育祭は 10 月 10 日、文化発表会は 11 月 6 日に行う。どちらも、保護者が見に来られる。"}
  - {id: rock-trip, tags: [life], text: "1 年生は、5 月 14 日に、岩山エリアで校外学習を行う。岩や地層を観察し、見たことをレポートにまとめる。"}
  - {id: ruin-trip, tags: [life], text: "2 年生は、10 月 22 日に、遺跡エリアで校外学習を行う。遺跡を見学し、昔の人の暮らしを調べる。"}
  - {id: trip-travel, tags: [life], text: "3 年生の修学旅行は、6 月 10 日から、2 泊 3 日で行う。行き先は、3 年生が話し合って決める。"}
  - {id: trip-gear, tags: [life, safety], text: "岩山や遺跡のエリアで校外学習をするときは、学校が貸し出すマスクを着ける。校外学習へは、学校が借り切った乗り合い便で行き、集合は午前 8 時 15 分に校庭にする。"}
  - {id: career, tags: [life], text: "3 年生は、4 月、9 月、12 月に、担任と保護者との進路の面談を行う。1 回の面談は 20 分。高校の入学の手続きや費用は、進学先の学校が決めるので、この学校では定められていない。"}
  - {id: graduation, tags: [life], text: "卒業式は、3 月 12 日に行う。3 年間在籍し、すべての教科を学び終えた生徒に、卒業証書を渡す。"}
  - {id: health-check, tags: [life, safety], text: "ご家庭では、毎朝、体温をはかり、体調を確かめてから登校させる。体調が悪い日は、休ませて、学校へ連絡する。"}

  - {id: air-alarm, tags: [safety], text: "設備に異常があると、教室の天井のランプが赤くなり、校内放送が流れる。生徒は、放送を聞いて、教員の指示に従う。"}
  - {id: air-stop, tags: [safety], text: "設備が止まったときは、教員の指示で、近くの整気室へ移る。整気室は、校舎に 6 つある。保護者へは、学校の連絡システムで知らせる。"}
  - {id: drill-plan, tags: [safety], text: "避難訓練は、年に 3 回。火災を想定した訓練を 5 月 12 日、設備が止まったときの訓練を 9 月 9 日、地震を想定した訓練を 1 月 20 日に行う。"}
  - {id: drill-how, tags: [safety], text: "避難の合図は、校内放送。生徒は、話さず、走らずに、教員のあとについて、校庭へ出る。"}
  - {id: assembly, tags: [safety], text: "避難したあとの集合場所は、校庭の北側。クラスごとに、出席番号の順に並び、担任が人数を確かめる。"}
  - {id: nurse, tags: [safety], text: "保健室は、授業のある日の午前 8 時 15 分から午後 4 時 30 分まで開いている。養護教諭が 1 名いる。"}
  - {id: fever, tags: [safety], text: "学校で体温が 37.5℃ 以上になったときは、保護者に連絡して、迎えに来てもらう。迎えが来るまで、保健室で休む。"}
  - {id: injury-serious, tags: [safety], text: "大きなけがや、急な病気のときは、学校が救急に連絡し、同時に保護者に連絡する。保護者が来るまで、教員が付き添う。"}
  - {id: contact-system, tags: [safety], text: "緊急のときは、学校の連絡システムで、保護者に一斉に知らせる。連絡先が変わったときは、すぐに事務室へ届ける。"}
  - {id: pickup, tags: [safety], text: "大きな災害のときは、保護者への引き渡しを行う。引き渡しには、引き渡しカードが要る。引き渡すまで、生徒は学校で預かる。"}
  - {id: trip-safety, tags: [safety], text: "岩山や遺跡のエリアでの校外学習は、生徒 10 名につき、教職員が 1 名付く。決められた道から外れず、岩や壁に登らない。"}
  - {id: closure, tags: [safety], text: "強い風や、設備に関する警報が出た日は、午前 6 時 30 分までに、学校の連絡システムで臨時休校を知らせる。"}

kinds:
  - id: gakusoku
    doc_type: regulation
    title: "{label} 学則"
    tags: [rules]
    variants: [全体]
    chars: [4500, 7500]
    outline: [目的, 定義, 修業と学年, 登校と出欠, 生徒への指導, 附則]
    style: 規定の文体。「第N条」で条を立て、である調。連絡先の電話番号は書かない。枝番の条（第N条の2）は使わない。
  - id: admission
    doc_type: manual
    title: "{label} 入学のご案内"
    tags: [admit]
    variants: [全体]
    chars: [4500, 7500]
