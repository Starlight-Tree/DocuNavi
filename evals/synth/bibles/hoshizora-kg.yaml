# ほしぞら幼稚園（架空。アルカ市の居住区エリアにある 3 年保育の幼稚園）の共通設定。2026-11-19 に新しく作った。アルカ市の学校 5 校（幼稚園・小学校・中学校・高校・大学）の 1 つ。
# 事実（facts）にある数値・日付・時刻だけが、生成した本文に出てよい。足す・直すと version が変わる。
