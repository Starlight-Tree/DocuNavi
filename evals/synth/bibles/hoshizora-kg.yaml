facts:
  - {id: world-city, tags: [core], text: "この学校は、アルカ市にある。アルカ市は、居住区・発着場・岩山・遺跡の 4 つのエリアに分かれている。"}
  - {id: world-air, tags: [core], text: "この星の厳しい環境に合わせて、校舎のすべての部屋に、空気を整える設備を備えている。校舎の中では、マスクなしで過ごせる。"}
  - {id: world-chain, tags: [core], text: "ほしぞら幼稚園、アルカ第一小学校、アルカ中央中学校、オアシス高等学校、ザーハード大学は、アルカ市の学校の並びで、進学の道がつながっている。"}
  - {id: school-place, tags: [core], text: "ほしぞら幼稚園は、アルカ市の居住区エリアにある幼稚園で、3 歳から 5 歳までの子どもが通う。3 年保育で、3 歳で入園し、5 歳で卒園する。園の名前には、夜空の星のように、ひとりひとりが輝いてほしいという願いを込めている。"}
  - {id: capacity, tags: [core, admit], text: "定員は、3 歳児が 40 名、4 歳児が 44 名、5 歳児が 48 名で、あわせて 132 名。各学年は 2 クラスで、3 歳児は「ひかり組」「そら組」、4 歳児は「にじ組」「ゆめ組」、5 歳児は「つばさ組」「みらい組」。"}
  - {id: office-hours, tags: [core, rules], text: "事務室の受付時間は、月曜日から金曜日の午前 8 時から午後 5 時 30 分まで。土曜日、日曜日、祝日は、事務室もお休み。"}
  - {id: care-hours, tags: [core, rules, life], text: "通常の保育は、月曜日から金曜日の午前 9 時から午後 2 時まで。土曜日、日曜日、祝日は、保育をしない。"}
  - {id: policy, tags: [core, rules], text: "園の方針は、遊びを通して、体と心と、人とかかわる力を育てること。できたかどうかよりも、やってみようとする気持ちを大切にする。"}

  - {id: staff, tags: [rules], text: "職員は、園長 1 名、担任 6 名、3 歳児クラスの補助 2 名、看護師 1 名。各クラスの担任は 1 名で、学年の途中で変わることは原則としてない。"}
  - {id: arrive, tags: [rules, life], text: "登園の時間は、午前 8 時 30 分から午前 9 時まで。この時間を過ぎて登園するときは、事務室に前もって連絡し、門の呼び出しボタンを押して、職員に開けてもらう。"}
  - {id: absent, tags: [rules], text: "欠席や遅刻のときは、その日の午前 8 時 45 分までに、事務室へ電話をするか、連絡帳で知らせる。連絡がないまま登園しないときは、園から家庭へ確かめの連絡をする。"}
  - {id: pickup, tags: [rules, life], text: "降園の時間は、午後 2 時。お迎えは、保護者か、あらかじめ登録した人が、園の門の前の受け渡し場所で行う。登録できるのは、1 家庭につき 4 名まで。"}
  - {id: id-check, tags: [rules, safety], text: "登録していない人には、お子さまを引き渡さない。登録した人の代わりに別の人が迎えに来るときは、前日までに事務室へ連絡し、当日は、登録カードと本人の分かるものを見せる。"}
  - {id: stop-handover, tags: [rules, life], text: "発着場の乗り合い便で帰る家庭には、停留所「ほしぞら園前」での引き渡しを選べる。職員が午後 2 時 10 分に園を出て、お子さまを停留所まで連れて行くので、保護者は午後 2 時 15 分までに停留所へ来る。希望は、入園の手続きのときに事務室へ届け出る。"}
  - {id: stop-morning, tags: [rules, life], text: "朝は、保護者かあらかじめ登録した人が、お子さまを園の門まで連れて来る。「ほしぞら園前」の停留所から園の門までは、歩いて約 3 分。お子さまだけで乗り合い便に乗ることはできない。"}
  - {id: illness, tags: [rules, safety], text: "朝の体温が 37.5℃ 以上のときや、元気がなく、食欲がないときは、登園を休む。保育中に熱が出たときは、保護者に連絡するので、できるだけ早く迎えに来る。"}
  - {id: infection, tags: [rules, safety], text: "ほかのお子さまにうつる病気にかかったときは、お休みする。治ったあとに登園するときは、医師が記入した登園許可書を、事務室へ出す。"}
  - {id: medicine, tags: [rules, safety], text: "薬は、原則として預からない。医師が保育中の服薬を必要と認めたときだけ、投薬依頼書を添えて預かる。"}
  - {id: belongings, tags: [rules, life], text: "持ち物と衣類には、すべて、お子さまの名前を書く。園での忘れ物は、事務室で 1 か月預かり、そのあと処分する。"}
  - {id: photo, tags: [rules], text: "行事で写真や動画を撮るときは、ご自分のお子さまを中心に撮る。ほかのお子さまが写ったものを、インターネットに載せない。"}
  - {id: visitors, tags: [rules, safety], text: "保護者が園舎に入るときは、事務室で名前を書き、来訪者用の名札を受け取る。名札は、帰るときに返す。"}
  - {id: withdraw, tags: [rules], text: "退園するときは、退園の届けを、退園する前の月の 20 日までに、事務室へ出す。別の幼稚園へ移る場合も同じ。"}
  - {id: not-defined, tags: [rules, fee], text: "制服と体操服の価格は、ほしぞら幼稚園では定めていない。取り扱う店で確かめる。"}

  - {id: eligibility, tags: [admit], text: "入園できるのは、入園する年の 4 月 1 日の時点で満 3 歳になっている、アルカ市内に住むお子さま。居住区エリア以外に住むお子さまも、申し込める。"}
  - {id: recruit, tags: [admit], text: "新しく入園する募集は、3 歳児クラスだけで、定員の範囲で受け付ける。4 歳児・5 歳児クラスへの入園は、途中入園として、空きがあるときだけ受け付ける。"}
  - {id: visit, tags: [admit], text: "園の見学は、毎週水曜日の午前 10 時 30 分から受け付ける。見学は予約制で、事務室へ前もって申し込む。"}
  - {id: briefing, tags: [admit], text: "入園説明会は、10 月 24 日の午後 1 時 30 分から行う。保護者 2 名まで参加できる。お子さまを連れて来てもよい。"}
  - {id: apply, tags: [admit], text: "入園の申込みは、11 月 2 日から 11 月 6 日までの、午前 9 時から午後 3 時に、事務室の窓口で受け付ける。郵送や電話では、受け付けない。"}
  - {id: docs, tags: [admit], text: "申込みの書類は、入園願書、住民票の写し 1 通、母子健康手帳の写し 1 部。書類がそろっていないと、受け付けられない。"}
  - {id: lottery, tags: [admit], text: "申込みが定員を超えたときは、11 月 9 日の午前 10 時に、職員の立ち会いで抽選をする。保護者の立ち会いは、必要ない。"}
  - {id: sibling-priority, tags: [admit], text: "すでに在園しているお子さまの弟や妹は、定員を超えたときも、抽選の前に入園が決まる。申込みのときに、在園しているお子さまの名前を、願書に書く。"}
  - {id: result, tags: [admit], text: "入園の結果は、11 月 13 日までに、書面で家庭へ知らせる。電話での問い合わせには、答えない。"}
  - {id: procedure, tags: [admit], text: "入園が決まった家庭は、11 月 27 日までに、入園の手続きを済ませる。期限までに手続きがないときは、辞退とみなす。"}
  - {id: interview, tags: [admit], text: "入園前の面談は、2 月 6 日に行う。お子さまと保護者が一緒に来て、健康、食べ物、生活の様子について、職員に話す。"}
  - {id: fitting, tags: [admit, life], text: "制服の採寸と、園で使う用品の受け渡しは、2 月 20 日に行う。"}
  - {id: ceremony, tags: [admit, life], text: "入園式は、4 月 8 日の午前 10 時から、園の遊戯室で行う。"}
  - {id: settling, tags: [admit, life], text: "入園式の翌日から 5 日間は、3 歳児だけ、午前 9 時から午前 11 時 30 分までの、慣らし保育をする。給食は、慣らし保育のあいだ、出さない。"}
  - {id: toilet, tags: [admit, life], text: "入園のとき、おむつが取れている必要はない。トイレの練習は、家庭と相談しながら、園で進める。"}

  - {id: entrance-fee, tags: [fee], text: "入園料は、30,000 円。入園の手続きのときに、1 回だけ納める。"}
  - {id: tuition, tags: [fee], text: "保育料は、月額 18,500 円。3 歳児、4 歳児、5 歳児で同じ金額。"}
  - {id: material-fee, tags: [fee], text: "教材費は、月額 1,800 円。絵本、画用紙、粘土など、保育で使う教材の代金。"}
  - {id: lunch-fee, tags: [fee], text: "給食費は、1 食 320 円。1 か月分をまとめて、翌月の保育料と一緒に請求する。"}
  - {id: event-fee, tags: [fee], text: "行事費は、年額 6,000 円。遠足、運動会、発表会などの費用で、5 月に 1 回で納める。"}
  - {id: care-fee, tags: [fee, life], text: "預かり保育の料金は、朝の預かりが 1 回 300 円、午後の預かりが 1 回 600 円。1 か月の合計は、9,000 円を上限とする。"}
  - {id: care-hours-extra, tags: [fee, life], text: "預かり保育の時間は、朝が午前 8 時から午前 9 時まで、午後が午後 2 時から午後 5 時 30 分まで。夏休みと冬休みも、預かり保育をする。"}
  - {id: care-apply, tags: [fee, life], text: "預かり保育は、前日の午後 4 時までに、事務室へ申し込む。1 日に預かれるのは、30 名まで。夏休みの 8 月 10 日から 8 月 14 日までは、預かり保育も含めて、園全体がお休み。"}
  - {id: payment-due, tags: [fee], text: "保育料、教材費、給食費は、毎月 20 日に、登録した口座から、翌月分を引き落とす。引き落としの手数料は、園が負担する。"}
  - {id: retry, tags: [fee], text: "口座の残高が足りず、引き落としができなかったときは、同じ月の 27 日に、もう 1 回だけ引き落とす。それでも引き落とせないときは、事務室から家庭へ連絡する。"}
  - {id: sibling-discount, tags: [fee], text: "同時に在園する 2 人目の保育料は、半額の 9,250 円。3 人目以降の保育料は、無料にする。"}
  - {id: hardship, tags: [fee], text: "家計が急に苦しくなったときは、事務室に相談できる。相談のうえで、保育料を 3 か月まで、分けて納められる。"}
  - {id: refund-entrance, tags: [fee], text: "入園料は、入園を辞退しても、返金しない。"}
  - {id: refund-monthly, tags: [fee], text: "月の途中で退園しても、その月の保育料は日割りにしない。退園の届けを出したあとの月からは、保育料がかからない。"}
  - {id: refund-lunch, tags: [fee], text: "連続して 3 日以上欠席し、前日までに園へ連絡したときは、その分の給食費を、翌月の請求から引く。"}

  - {id: morning-meeting, tags: [life], text: "朝の会は、午前 9 時 30 分から。歌をうたい、出席を取り、その日の予定を先生と一緒に確かめる。"}
  - {id: outdoor, tags: [life, safety], text: "外遊びは、午前 10 時 45 分から、1 日 30 分まで。園庭へ出るときは、マスクを着ける。外遊びをするかどうかは、天気と空気の様子を見て、園長が決める。"}
  - {id: lunch-time, tags: [life], text: "給食は、午前 11 時 45 分から。食べる時間は約 40 分で、食べ終わったあとは、絵本を読んで静かに過ごす。"}
  - {id: closing, tags: [life], text: "帰りの会は、午後 1 時 30 分から。その日のできごとを話し、明日の予定を知らせる。"}
  - {id: daily-items, tags: [life], text: "毎日の持ち物は、通園かばん、連絡帳、水筒、ハンカチ、ティッシュ。水筒には、水かお茶だけを入れる。"}
  - {id: mask, tags: [life, safety], text: "停留所までの行き帰りなど、園の外へ出るときは、マスクを着ける。マスクは、名前を書いたものを、通園かばんに 1 枚、予備として入れておく。"}
  - {id: uniform, tags: [life], text: "園では、制服（上着と帽子）と体操服を着る。靴は、白い運動靴で、室内では、名前を書いた内履きをはく。"}
  - {id: spring-trip, tags: [life], text: "春の遠足は、5 月 22 日に、全学年で、居住区エリアの公園へ行く。"}
  - {id: sports-day, tags: [life], text: "運動会は、10 月 10 日に、遊戯室で行う。見に来られるのは、1 家庭につき 2 名まで。"}
  - {id: autumn-trip, tags: [life], text: "秋の遠足は、10 月 17 日。4 歳児と 5 歳児は、乗り合い便の貸し切りの便で、遺跡エリアの見学広場へ行く。3 歳児は、居住区エリアの公園へ行く。"}
  - {id: recital, tags: [life], text: "発表会は、12 月 12 日に、遊戯室で行う。歌、おゆうぎ、劇を、保護者に見てもらう。"}
  - {id: school-trip, tags: [life], text: "5 歳児は、1 月 22 日に、岩山エリアのふもとにある見学施設へ、校外学習に行く。石や岩のでき方を、見て、さわって学ぶ。"}
  - {id: graduation, tags: [life], text: "卒園式は、3 月 18 日。3 歳児と 4 歳児の修了式は、3 月 19 日に行う。"}
  - {id: terms, tags: [life], text: "学期は 3 つある。1 学期は 4 月 8 日から 7 月 19 日まで、2 学期は 9 月 1 日から 12 月 20 日まで、3 学期は 1 月 8 日から 3 月 19 日まで。学期のあいだは、夏休みと冬休み。"}
  - {id: home-request, tags: [life], text: "ご家庭では、連絡帳を毎日見て、返事を書いてほしい。夜は、午後 8 時 30 分までに寝る習慣をつけると、朝の登園が楽になる。"}

  - {id: drill-monthly, tags: [safety], text: "避難訓練は、毎月 1 回、地震、火事、停電などを想定して行う。お子さまは、先生の合図で、先生のそばに集まる。"}
  - {id: drill-big, tags: [safety], text: "全員で行う総合の避難訓練は、年に 2 回、6 月と 12 月に行う。避難にかかる時間の目標は、3 分以内。"}
  - {id: evac-place, tags: [safety], text: "園舎の外へ避難するときの集合場所は、園庭の北側。避難のときは、お子さまを列にして、職員が人数を数える。"}
  - {id: air-filter, tags: [safety], text: "空気を整える設備のフィルターは、3 か月に 1 回、交換する。お休みの日に、職員と業者が行うので、保育には影響しない。"}
  - {id: air-indicator, tags: [safety], text: "各部屋の入口には、設備の表示灯がある。緑のときは正常で、赤のときは異常。赤に気づいたら、すぐに職員へ知らせる。"}
  - {id: air-door, tags: [safety], text: "園舎の窓は、開けない。出入口の扉は、人が通ったら閉め、開けたままにしない。設備の働きを保つため。"}
  - {id: air-stop, tags: [safety], text: "設備が止まったときは、動いている別の部屋へ、すぐにお子さまを移す。そのあと、一斉連絡の仕組みで、保護者へ知らせる。"}
  - {id: first-aid, tags: [safety], text: "軽いけがは、看護師が園の保健室で手当てをし、連絡帳に書いて知らせる。頭を打ったときは、軽くても、その日のうちに保護者へ電話をする。"}
  - {id: hospital, tags: [safety], text: "病院へ行く必要があるときは、すぐ保護者に連絡する。つながらないときは、登録してある緊急の連絡先へ連絡する。緊急の連絡先は、2 件まで登録できる。"}
  - {id: allergy, tags: [safety], text: "食べ物のアレルギーがあるときは、入園の手続きのときに、医師の診断書を出す。園は、診断書をもとに、除去した給食を用意する。"}
  - {id: gate, tags: [safety], text: "園の門は、保育の時間中は鍵をかけ、職員だけが開け閉めする。知らない人が園に近づいたときは、すぐに事務室へ知らせる。"}
  - {id: disaster-notice, tags: [safety], text: "災害や緊急のときは、一斉連絡の仕組みで、保護者へ、園の様子と迎えの方法を知らせる。連絡先が変わったときは、すぐに事務室へ届け出る。"}
  - {id: disaster-pickup, tags: [safety], text: "災害のときは、園が安全を確かめたあとに、園の門の前の受け渡し場所で、お子さまを引き渡す。保護者は、お迎えの前に、一斉連絡の内容を確かめる。"}
  - {id: disaster-stock, tags: [safety], text: "迎えに来られない場合に備えて、園には、お子さまの分の水と食べ物を、3 日分、蓄えてある。"}

