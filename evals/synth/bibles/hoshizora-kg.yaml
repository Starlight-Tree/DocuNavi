premise: アルカ市の居住区エリアにある幼稚園、ほしぞら幼稚園（3 歳から 5 歳の 3 年保育）。保護者と、入園を考える家庭に、園の決まり・入園・保育料・園生活・安全を案内する。問い合わせ先は、園の事務室。
contacts: []
