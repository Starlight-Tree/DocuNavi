# 検索の評価セット（段階 0）。読み方と指標は evals/README.md。
#
# 各質問の項目:
#   id               一意の ID
#   question         検索に渡す質問
#   category         factual / paraphrase / multi_hop / out_of_scope
#   kind             任意。tests/rag_eval_cases.py から移した質問の元の種別（direct / keyword / colloquial ...）
#   expected_doc_ids 回答の根拠があるファイル。multi_hop は全部が返ること。out_of_scope には書かない
#   evidence         検索結果の本文に含まれていてほしい根拠の部分文字列。
#                    期待ファイルごとに、そのファイルの検索結果にどれか 1 つが含まれていれば hit
#   scope_kind       out_of_scope のみ必須。off_topic（資料と無関係）/ on_topic_absent（ザーハードの話だが資料に無い）
#
# q001-q029 は tests/rag_eval_cases.py と同じ質問（資料を精読して手で作り、実装に合わせ込んでいない）。
# 同期は tests/test_eval_retrieval.py が検査する。q030 以降は、検索の結果を見る前に資料だけから書いた。
# 結果を見て質問や期待値を書き換えない（合わせ込みになる）。直すときは、理由をコミットに書く。

