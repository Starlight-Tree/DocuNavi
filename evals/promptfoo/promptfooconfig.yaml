# Promptfoo の試験導入（2026-11-16）。複数ターンの会話を、golden set の runner と評価器で採点する。読み方と実行は README.md。
#
# 1 つのテスト = 1 つの会話。cases は chat_golden.yaml と同じ形（既定値はそちらから足される）。
# 期待は、結果を見る前に、資料（evals/fixtures/zahard_txt/、storage/pdf/）と追質問の仕様（app/agents/followup.py）から決めた。
# **結果を見て期待値を緩めない**（直すときは、理由をコミットに書く）。
#   - 追質問の補完（trajectory が [llm, search_documents, llm]）は、質問が 12 文字未満か指示語を含むとき
#   - 「$not_found」は、chat_golden.yaml の「資料に無い」の言い換えの一覧

description: DocuNavi 複数ターンの会話（試験導入）

prompts:
  - "会話: {{name}}"

providers:
  - id: file://provider.py
    label: docunavi-golden-runner
    config:
      timeout: 180000 # ミリ秒。会話 1 本（2 ターン）の上限

# 実 API の費用と上限を守るため、会話は 1 本ずつ流す（上限は PROMPTFOO_GOLDEN_MAX_LLM_CALLS）
evaluateOptions:
  maxConcurrency: 1
  cache: false

defaultTest:
  assert:
    - type: python
      value: file://assert_golden.py

tests:
  # 追質問: 大気 → 探査団に必要なもの
  - description: 追質問（指示語）
    vars:
      name: atmosphere-followup
      cases:
        - id: pf01
          category: 通常
          thread: pfA
          question: "ザーハードの大気について教えて"
          expect_sources: ["ザーハード1.pdf"]
          must_include: [["酸素"], ["薄い", "1/10", "十分の一", "10分の1"]]
          must_not_include: ["洗濯"]
          max_chars: 600
        - id: pf02
          category: マルチターン
          thread: pfA
          question: "それで探査団は何が必要になりますか"
          trajectory: [llm, search_documents, llm]
          expect_sources: ["ザーハード1.pdf"]
          must_include: [["生命維持装置", "酸素供給装置"]]
          must_not_include: ["洗濯"]
          max_chars: 600

  # 話題の変更: ザーハードのエネルギー源 → 寮の門限（長い質問で、補完は走らない）
  - description: 話題の変更（補完なし）
    vars:
      name: topic-change
      cases:
        - id: pf03
          category: 通常
          thread: pfB
          question: "エネルギー源はどんなものですか"
          expect_sources: ["ザーハード3.pdf"]
          must_include: [["人工", "放射線", "磁場"]]
          must_not_include: ["洗濯"]
          max_chars: 600
        - id: pf04
          category: マルチターン
          thread: pfB
          question: "つばさ大学の学生寮の門限は何時ですか"
          expect_sources: ["tsubasa_dorm_rules.pdf"]
          must_include: [["午後11時", "23時", "11時"]]
          # 前の話題（エネルギー源）を引きずらない
          must_not_include: ["エネルギー", "放射線"]

  # 資料に無いことへの追質問: 文明 → その人口（資料に無い）
  - description: 資料にない追質問
    vars:
      name: not-in-docs-followup
      cases:
        - id: pf05
          category: 通常
          thread: pfC
          question: "ザーハリアン文明について教えて"
          expect_sources: ["ザーハード2.pdf"]
          must_include: [["ザーハリアン"]]
          must_not_include: ["洗濯"]
          max_chars: 600
        - id: pf06
          category: マルチターン
          thread: pfC
          question: "その人口は何人でしたか"
          trajectory: [llm, search_documents, llm]
          expect_sources: ["ザーハード2.pdf"]
          must_include: [["$not_found"]]
          # 資料に人口の記述は無い。数を作らない
          must_not_include: ["万人", "億人", "千人"]
          max_chars: 300

  # 追質問: 遺跡の構造 → 罠
  - description: 追質問（短い質問）
    vars:
      name: ruins-followup
      cases:
        - id: pf07
          category: 通常
          thread: pfD
          question: "遺跡の構造について教えて"
          expect_sources: ["ザーハード2.pdf"]
          must_include: [["複雑", "多層"]]
          must_not_include: ["洗濯"]
          max_chars: 600
        - id: pf08
          category: マルチターン
          thread: pfD
          question: "罠はありますか"
          trajectory: [llm, search_documents, llm]
          expect_sources: ["ザーハード2.pdf"]
          must_include: [["罠"]]
          must_not_include: ["洗濯"]
          max_chars: 400

  # ---- 「分かる範囲を添える」型（2026-11-16 追加。pf09-pf17）----
  # 目標の挙動: 同じ話題で資料に書かれていることがあるのに、聞かれた詳細だけが資料に無いとき、書かれていることを先に短く述べ、
  # 聞かれた点は「資料には記載がありません」の言い換えで述べる（推測は足さない）。「資料には記載がありません。」だけの返答は、不合格。
  # must_include の 2 つの要素（言い換えの一覧 + 既知の事実）を、どちらも満たすこと。期待は、プロンプトを変える前に書いた。
  # 資料: 酸素・昼夜の温度差 = ザーハード1、防衛機構 = ザーハード2、寮の外泊 = 第 20 条（届け出の方法は資料に無い）。

  # 画面で見つかった会話（酸素濃度 → 昼夜の気温差 → 夕方）。夕方の記述は資料に無い
  - description: 分かる範囲を添える（夕方）
    vars:
      name: partial-evening
      cases:
        - id: pf09
          category: 通常
          thread: pfE
          question: "ザーハードの大気の酸素濃度はどれくらい？"
          expect_sources: ["ザーハード1.pdf"]
          must_include: [["1/10", "十分の一", "10分の1"]]
          must_not_include: ["洗濯"]
        - id: pf10
          category: マルチターン
          thread: pfE
          question: "昼と夜の気温差について教えて"
          expect_sources: ["ザーハード1.pdf"]
          must_include: [["高温"], ["極寒"]]
          must_not_include: ["洗濯", "℃"]
          max_chars: 500
        - id: pf11
          category: マルチターン
          thread: pfE
          question: "夕方はどう？"
          trajectory: [llm, search_documents, llm]
          expect_sources: ["ザーハード1.pdf"]
          must_include: [["$not_found"], ["高温", "極寒"]]
          must_not_include: ["洗濯", "℃", "過ごしやすい", "穏やか", "暖か", "涼し"]
          max_chars: 300

  # 防衛システムの止め方（gc12 と同じ話題）。止め方は資料に無いが、防衛システムが侵入者を攻撃することは書いてある
  - description: 分かる範囲を添える（止め方）
    vars:
      name: partial-stop-defense
      cases:
        - id: pf12
          category: 通常
          thread: pfF
          question: "遺跡の防衛システムについて教えて"
          expect_sources: ["ザーハード2.pdf"]
          must_include: [["防衛システム", "防衛機構"], ["侵入者", "攻撃"]]
          must_not_include: ["洗濯"]
          max_chars: 600
        - id: pf13
          category: マルチターン
          thread: pfF
          question: "それはどうやって止められますか"
          trajectory: [llm, search_documents, llm]
          expect_sources: ["ザーハード2.pdf", "ザーハード3.pdf"]
          must_include: [["$not_found"], ["侵入者", "攻撃", "防衛システム", "防衛機構"]]
          must_not_include: ["洗濯"]
          max_chars: 300

  # 崩壊の時期（gc15 と同じ話題）。崩壊の時期は資料に無いが、繁栄が数千年以上前とは書いてある
  - description: 分かる範囲を添える（崩壊の時期）
    vars:
      name: partial-collapse-time
      cases:
        - id: pf14
          category: 通常
          thread: pfG
          question: "ザーハリアン文明が崩壊した原因は？"
          expect_sources: ["ザーハード2.pdf"]
          must_include: [["明記", "明らか", "判明", "特定", "解明", "記載", "不明", "何らかの原因"]]
          must_not_include: ["隕石", "疫病", "戦争が原因", "気候変動"]
          max_chars: 500
        - id: pf15
          category: マルチターン
          thread: pfG
          question: "それはいつ頃のことですか"
          trajectory: [llm, search_documents, llm]
          expect_sources: ["ザーハード2.pdf"]
          must_include: [["$not_found"], ["数千年", "何らかの原因"]]
          must_not_include: ["洗濯"]
          max_chars: 300

  # 寮の外泊（別の資料）。届け出が要ることは第 20 条にあるが、届け出の方法（書式・窓口など）は資料に無い
  - description: 分かる範囲を添える（外泊の届け出方法）
    vars:
      name: partial-dorm-notice
      cases:
        - id: pf16
          category: 通常
          thread: pfH
          question: "つばさ大学の学生寮の外泊の決まりを教えて"
          expect_sources: ["tsubasa_dorm_rules.pdf"]
          must_include: [["前日"], ["寮監"]]
          max_chars: 600
        - id: pf17
          category: マルチターン
          thread: pfH
          question: "それはどうやって届け出ますか"
          trajectory: [llm, search_documents, llm]
          expect_sources: ["tsubasa_dorm_rules.pdf"]
          must_include: [["$not_found"], ["前日", "寮監"]]
          must_not_include: ["メール", "電話", "用紙", "窓口", "アプリ"]
          max_chars: 300
