# api の 8000 番を、このマシンの 127.0.0.1 にだけ公開する上書き（curl で API を直接確かめるとき用）。
# 普段の docker-compose.yml では api はポートを公開せず、frontend（:3000）のプロキシ経由でだけ使う。
#
#   docker compose -f docker-compose.yml -f docker-compose.api-port.yml up -d
#   curl -s localhost:8000/health
#
# 127.0.0.1 に限るのは、同じネットワークの他の機器（LAN）から api に届かせないため。
services:
  api:
    ports:
      - "127.0.0.1:8000:8000"
