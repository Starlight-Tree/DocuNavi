# プロジェクト名を固定する（ホストの `docker compose up` と、開発コンテナ経由の起動で、同じコンテナ・ボリュームを使うため。
# 既定はこのフォルダー名で、いまは同じ docunavi）。開発コンテナの定義は .devcontainer/docker-compose.yml。
name: docunavi

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docunavi-api
    # 表示用ラベル（.vscode/settings.json の groupByLabel が読む）。動作には影響しない。
    labels:
      local.ui.group: "app-docunavi"
    # ポートは公開しない。画面は frontend（:3000）のプロキシ経由で使う。8000 番を確かめたいときは docker-compose.api-port.yml を重ねる
    env_file:
      # .env が無くても起動できる（その場合は GEMINI_API_KEY 未設定 = モックモード）
      - path: .env
        required: false
    environment:
      # ホスト↔コンテナ間のボリュームでファイル変更通知が届かない環境（Docker Desktop 等）向け
      WATCHFILES_FORCE_POLLING: "true"
    networks:
      - frontend-net
    volumes:
      # app/ の親が /code になるため `app.main:app` のモジュールパスが保たれ、
      # tools.py の ../../storage/pdf も /code/storage/pdf に解決される。
      # compose はホストで実行する前提（devcontainer 内には Docker を入れていない）。
      - ./app:/code/app
      - ./storage:/code/storage:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /code/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 本番相当の起動の確認用（profile `prod`。普段の `docker compose up` や開発コンテナの runServices には含まれない）。
  # `api` との違い: マウントなし・--reload なし（イメージに COPY したコードを、Dockerfile の CMD = hypercorn でそのまま動かす）、ポート非公開、再起動しない。
  # 本番（Cloud Run）と同じイメージの作りと起動コマンドが、起動検査を通るかを見るためのもの（ローカルの api は D1 につながない）。画面（frontend）は付けない。
  # 起動と確認: docker compose up -d --build api-prod → docker compose exec api-prod …（docs/development.md の「本番相当の起動の確認」）
  api-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docunavi-api-prod
    env_file:
      - path: .env
        required: false
    networks:
      - frontend-net
    # command・volumes・ports は置かない（Dockerfile の CMD がそのまま動く。$PORT は未指定なので 8000）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "no"

  # 画面の開発サーバー（frontend/ の next dev。http://localhost:3000）。api とは別のコンテナで、ホットリロードで動く。
  # /chat /health /documents /threads は、next.config.ts の rewrites が、サービス名 api（Compose 内の名前解決）へ転送する
  # （API_PROXY_TARGET。NEXT_PUBLIC_API_BASE_URL は空にして、ブラウザーからは同じオリジンに見せる）。
  # api が healthy になってから起動する。本番の画面は Cloudflare の Worker が配信し、api（Cloud Run）は画面を配信しない。
  frontend:
    image: node:24-slim
    container_name: docunavi-frontend
    # 表示用ラベル（.vscode/settings.json の groupByLabel が読む）。動作には影響しない。
    labels:
      local.ui.group: "app-docunavi"
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - frontend-net
    environment:
      API_PROXY_TARGET: "http://api:8000"
      # 空にする（frontend/.env.local の値より、コンテナの環境変数が優先される）
      NEXT_PUBLIC_API_BASE_URL: ""
      # ホスト↔コンテナの変更通知が届かず、ホットリロードが効かないときだけ、次の行の # を外す
      # （ポーリングは CPU を使う。Docker Desktop など、ファイル変更通知が届かない環境向け）
      # WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # node_modules と .next はホストのものと分ける（ネイティブの依存が OS ごとに違うため）。依存を変えたら起動時の npm install が反映する
      - frontend_next_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    # package-lock.json のとおりに入れる。ボリュームが node_modules の場所なので、npm ci（ディレクトリごと消す）は使わない
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

# frontend-net: frontend と api（api は Gemini など外へも出る。frontend は npm install で外へ出る）。
networks:
  frontend-net:
    name: docunavi-frontend-net

volumes:
  frontend_next_node_modules:
  frontend_next_cache:
