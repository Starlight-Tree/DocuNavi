services:
  # 資料の検索と会話履歴用のローカル Postgres（pgvector 入り。本番の Supabase とは別）。
  # ホストにポートを公開せず、internal の backend-net（外へも出られない）にだけ置く。api からだけ db:5432 で届く。
  # 空の状態で始まる。資料の取り込みと埋め込みは、api が healthy になってから別に行う（docs/development.md の「ローカルの db」）。
  db:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: docunavi-db
    environment:
      POSTGRES_DB: docunavi
      POSTGRES_PASSWORD: "${LOCAL_DB_PASSWORD:-docunavi-local}"
      # db/local-init/01-bootstrap.sh が chatbot_app のパスワードに使う
      APP_DB_PASSWORD: "${LOCAL_DB_PASSWORD:-docunavi-local}"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # pg-data が空の初回の起動でだけ実行される（ロール・スキーマ・vector 型の「入れ物」だけ。テーブルは作らない）
      - ./db/local-init:/docker-entrypoint-initdb.d:ro
      # マイグレーションを db の中から psql で適用するため（手順は docs/development.md）。起動時には実行されない
      - ./db/migrations:/migrations:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docunavi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docunavi-api
    # ポートは公開しない。画面は frontend（:5173）のプロキシ経由で使う。8000 番を確かめたいときは docker-compose.api-port.yml を重ねる
    env_file:
      # .env が無くても起動できる（その場合は GEMINI_API_KEY 未設定 = モックモード）
      - path: .env
        required: false
    environment:
      # ホスト↔コンテナ間のボリュームでファイル変更通知が届かない環境（Docker Desktop 等）向け
      WATCHFILES_FORCE_POLLING: "true"
      # .env の DATABASE_URL（本番と同じ DB のことがある）は使わず、compose の db に向ける（environment は env_file より優先される）。
      # ロールは db/local-init/01-bootstrap.sh が作る chatbot_app。パスワードに URL で特別な文字（@ : / など）は使えない
      DATABASE_URL: "postgresql://chatbot_app:${LOCAL_DB_PASSWORD:-docunavi-local}@db:5432/docunavi"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    volumes:
      # app/ の親が /code になるため `app.main:app` のモジュールパスが保たれ、
      # tools.py の ../../storage/pdf も /code/storage/pdf に解決される。
      # compose はホストで実行する前提（devcontainer 内には Docker を入れていない）。
      - ./app:/code/app
      - ./storage:/code/storage:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /code/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 画面の開発サーバー（Vite。http://localhost:5173）。api とは別のコンテナで、ホットリロードで動く。
  # /chat /health /documents /threads は、サービス名 api（Compose 内の名前解決）へ転送する。
  # api が healthy になってから起動する。api の画面配信（http://localhost:8000）は、これまでどおりイメージの中のビルド済み成果物。
  frontend:
    image: node:24-slim
    container_name: docunavi-frontend
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    networks:
      - frontend-net
    environment:
      VITE_DEV_HOST: "0.0.0.0"
      VITE_DEV_PROXY_TARGET: "http://api:8000"
      # ホスト↔コンテナの変更通知が届かず、ホットリロードが効かないときだけ、次の行の # を外す
      # （ポーリングは CPU を使う。Docker Desktop など、ファイル変更通知が届かない環境向け）
      # CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      # node_modules はホストのものと分ける（ネイティブの依存が OS ごとに違うため）。依存を変えたら起動時の npm install が反映する
      - frontend_node_modules:/app/node_modules
    # package-lock.json のとおりに入れる。ボリュームが node_modules の場所なので、npm ci（ディレクトリごと消す）は使わない
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      # 初回は npm install に時間がかかる
      start_period: 60s
    restart: unless-stopped

# frontend-net: frontend と api（api は Gemini など外へも出る。frontend は npm install で外へ出る）。
# backend-net: api と db だけ。internal なので、db は外へ出られず、ホストからも届かない。
networks:
  frontend-net:
    name: docunavi-frontend-net
  backend-net:
    name: docunavi-backend-net
    internal: true

volumes:
  frontend_node_modules:
  pg-data:
