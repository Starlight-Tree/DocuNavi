# GitHub Actions の SHA 固定（.github/workflows/ci.yml）と、Docker のベースイメージ、Go のモジュールを最新に保つ。
# セキュリティ更新は公表の直後に出る（schedule・cooldown は効かない）ので、同時に出た分を ecosystem ごとに 1 つの PR にまとめる（applies-to: security-updates）。
# pip / npm は、依存の固定（requirements*.in → uv pip compile）が落ち着いてから足す。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 公開から 7 日たったリリースだけを提案する（侵害されたリリースが報告される猶予を置く）
    cooldown:
      default-days: 7
    # このリポジトリのコミット規約（Conventional Commits）に合わせる
    commit-message:
      prefix: ci
    # minor と patch は 1 つの PR にまとめる。major はまとめず、1 件ずつ PR にする（互換性を個別に確かめる）
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
      github-security:
        applies-to: security-updates
        patterns: ["*"]

  # Dockerfile のベースイメージ（FROM）を最新に保つ。Dockerfile は置き場所ごとに別のディレクトリ。
  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
      - /ops/mcp_probe
      - /ops/mcp_search
      - /ops/pg_backup
      - /ops/r2_key_issuer
      - /ops/r2_wire
      - /ops/sse-relay
      - /ops/sse-fake-upstream
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
    # Python のイメージは、パッチ更新（3.14.x）だけ追う。バージョンの引き上げは、アプリ・CI・依存の固定ファイル
    # （--python-version 3.14）の移行を伴うので、自動の PR にしない（2026-11-16、3.12 から 3.15 への PR #9 が、
    # orjson・pyyaml・zstandard の 3.15 用 wheel が無く失敗。3.14 へは手動で移行した）。上げるときは、wheel の有無を先に確かめる
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  # go.mod は Go の中継・疑似上流・読み取り API にある。外部の依存があるのは読み取り API（pgx）だけ。
  - package-ecosystem: gomod
    directories:
      - /ops/sse-relay
      - /ops/sse-fake-upstream
      - /ops/read-api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]
