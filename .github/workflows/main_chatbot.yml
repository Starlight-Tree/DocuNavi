name: Build and Deploy Node.js app to Azure Web App - chatbot6

# イベントトリガーの定義
on:
  push:
    branches:
      - main  # main ブランチへの push 時に実行
  workflow_dispatch:  # 手動での実行をサポート

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: |
          npm install

      - name: Build the app (if necessary)
        run: |
          npm run build --if-present

      # テストはスキップするのでコメントアウト
      # - name: Run tests (skipped)
      #   run: |
      #     npm test

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write  # This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure using Azure CLI
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZUREAPPSERVICE_CLIENTID_1BA69C8F890F4F7C8E7D9F1077B3A93E }}",
              "clientSecret": "${{ secrets.AZUREAPPSERVICE_CLIENTSECRET }}",
              "tenantId": "${{ secrets.AZUREAPPSERVICE_TENANTID_077188EFC36E4B9B831498AD9E08713B }}",
              "subscriptionId": "${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_205F0A0378BB4B4FB15260FF2D7C0C3B }}"
            }
          enable-AzPSSession: false
          environment: azurecloud
          allow-no-subscriptions: false
          audience: api://AzureADTokenExchange
          auth-type: SERVICE_PRINCIPAL

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chatbot6'  # Azure Web Appの名前
          package: .  # デプロイするパッケージのパス
