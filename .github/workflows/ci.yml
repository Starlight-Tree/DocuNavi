name: CI

# テストとビルドだけを行う。デプロイは含まない。Cloudflare へのデプロイは、deploy.yml を手動で実行する
# （main の CI が成功したことを確かめてから。Environment「production」の承認つき）。
# アクションは、改ざんされたタグを掴まないよう、コミット SHA で固定している（コメントは対応するタグ）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Actions 画面や gh workflow run から、任意のブランチで手動実行する

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # tests/test_history_pg_backend.py（Postgres 版の窓口）が使う、使い捨ての Postgres（pgvector 入り）。本物の DB には触れない
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Dockerfile のベースイメージ（python:3.14-slim）と、依存を固定した版にそろえる
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'
      # 設定は pyproject.toml の [tool.ruff]。整形、lint、テストの順（版は requirements-dev.txt で固定）
      - name: Check formatting (ruff format)
        run: ruff format --check .
      - name: Lint (ruff check)
        run: ruff check .
      # tests/conftest.py が GEMINI_API_KEY を空にしてモックモードに固定する。実 API は呼ばない。
      # tests/test_http_smoke.py は、実際の uvicorn を空きポートで起動して HTTP で確かめる。
      - name: Run pytest
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q -n auto

  worker:
    name: Auth Worker (workers/api) typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/api/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      # 設定値の検査（src/authConfig.ts）。Node の標準のテスト実行（node --test）で、依存は足さない
      - name: Test
        run: npm test

  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lint.txt
      # ツールは、ハッシュ付きの固定（requirements-lint.txt）から入れる。アプリの依存とは別
      - name: Install the linters
        run: pip install --require-hashes -r requirements-lint.txt
      # 式の誤り・存在しないキー・run の中のシェルの問題など、構文と型の検査
      - name: actionlint
        run: actionlint
      # セキュリティの検査（権限・テンプレート注入・SHA 固定の偽装など）。GH_TOKEN は、固定した SHA が
      # 本物のリポジトリの履歴にあるか、既知の脆弱なアクションでないかを、GitHub に問い合わせるためだけに使う
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .

  commit-messages:
    name: Commit messages (English, Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # 範囲（push の前の位置〜今）のコミットを読む
          persist-credentials: false  # 後続のステップで git の認証は使わない
      # 新しいコミットの件名だけを検査する（過去の履歴は対象外）。起点が無いとき（強制プッシュの直後・
      # 手動実行）は、最新の 1 件だけを見る。値は環境変数で渡す（式をコマンドに埋め込まない）
      - name: Check the new commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_commit_messages.py --range "${BASE_SHA}..${HEAD_SHA}"

  frontend:
    name: Frontend (Next.js) tests, type-check and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  go:
    name: Go (SSE relay and fake upstream) vet and race tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      # 版は go.mod（1.26.10）から読む。開発コンテナ・両方の Dockerfile と同じ版。標準ライブラリだけで go.sum が無いので、キャッシュは使わない
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ops/sse-relay/go.mod
          cache: false
      - name: Go version matches both go.mod files
        run: |
          test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' ops/sse-relay/go.mod)"
          test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' ops/sse-fake-upstream/go.mod)"
          test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' ops/read-api/go.mod)"
      - name: SSE relay (go vet, go test -race)
        working-directory: ops/sse-relay
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Fake upstream (go vet, go test -race)
        working-directory: ops/sse-fake-upstream
        run: |
          go vet ./...
          go test -race -count=1 ./...
      # 読み取り API（ADR 0017）。外部の依存は pgx だけ。実 DB の検査（postgres_test.go）は READ_API_TEST_DATABASE_URL が無いので飛ばす
      - name: Read API (go vet, go test -race)
        working-directory: ops/read-api
        run: |
          go mod verify
          go vet ./...
          go test -race -count=1 ./...

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: docunavi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # キーを渡さないので、アプリはモックモードで起動する。固定した依存で実際に動くことと、
      # /health と /chat が、イメージの中で応答することを確かめる（画面は Cloudflare の Worker `docunavi-web`（frontend）が配信する）。
      - name: Start the image and check it responds
        run: |
          docker run -d --name docunavi -p 8000:8000 docunavi:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > health.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"status": *"ok"' health.json
          curl -fsS -X POST http://127.0.0.1:8000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message": "ザーハードの大気について教えて"}' > chat.json
          grep -q '"reply"' chat.json
      - name: Show container logs on failure
        if: failure()
        run: docker logs docunavi
