name: CI

# テストとビルドだけを行う。デプロイは含まない（含めるなら CLAUDE.md の「Git」の運用を見直す）。
# アクションは、改ざんされたタグを掴まないよう、コミット SHA で固定している（コメントは対応するタグ）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Actions 画面や gh workflow run から、任意のブランチで手動実行する

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Dockerfile のベースイメージ（python:3.12-slim）と、依存を固定した版にそろえる
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # tests/conftest.py が GEMINI_API_KEY を空にしてモックモードに固定する。実 API は呼ばない。
      # tests/test_http_smoke.py は、実際の uvicorn を空きポートで起動して HTTP で確かめる。
      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend tests and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Dockerfile のビルドステージ（node:24-slim）にそろえる
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: chatbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # キーを渡さないので、アプリはモックモードで起動する。固定した依存で実際に動くことと、
      # 画面（フロントエンドのビルド成果物）と /chat が、イメージの中で応答することを確かめる。
      - name: Start the image and check it responds
        run: |
          docker run -d --name chatbot -p 8000:8000 chatbot:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > health.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"status": *"ok"' health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "200"
          curl -fsS -X POST http://127.0.0.1:8000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message": "ザーハードの大気について教えて"}' > chat.json
          grep -q '"reply"' chat.json
      - name: Show container logs on failure
        if: failure()
        run: docker logs chatbot
