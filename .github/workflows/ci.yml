name: CI

# テストとビルドだけを行う。デプロイは含まない（含めるなら CLAUDE.md の「Git」の運用を見直す）。
# アクションは、改ざんされたタグを掴まないよう、コミット SHA で固定している（コメントは対応するタグ）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Actions 画面や gh workflow run から、任意のブランチで手動実行する

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 会話履歴の Postgres 保存（tests/test_history_postgres.py）を本物の DB で確かめるための、使い捨ての Postgres。
    # 開発コンテナで確かめた版（17）にそろえる。テスト専用のダミーの認証情報で、秘密情報は入っていない。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # tests/conftest.py は DATABASE_URL を空にする。Postgres のテストを動かすのは TEST_DATABASE_URL のほう。
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Dockerfile のベースイメージ（python:3.12-slim）と、依存を固定した版にそろえる
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # 設定は pyproject.toml の [tool.ruff]。整形、lint、テストの順（版は requirements-dev.txt で固定）
      - name: Check formatting (ruff format)
        run: ruff format --check .
      - name: Lint (ruff check)
        run: ruff check .
      # tests/conftest.py が GEMINI_API_KEY を空にしてモックモードに固定する。実 API は呼ばない。
      # tests/test_http_smoke.py は、実際の uvicorn を空きポートで起動して HTTP で確かめる。
      - name: Run pytest
        run: pytest -q
      # TEST_DATABASE_URL の綴りがずれると、Postgres のテスト（会話履歴と、資料の取り込み）は静かに
      # スキップされたまま green になる。スキップが 1 件でもあれば落とす
      # （上のステップと同じテストをもう一度走らせるが、数秒で済む）。
      - name: Postgres tests must run, not be skipped
        run: |
          set -o pipefail
          pytest -q -rs tests/test_history_postgres.py tests/test_ingestion_postgres.py tests/test_access_admin_contract.py | tee postgres-tests.log
          if grep -qi skipped postgres-tests.log; then
            echo "Postgres のテストがスキップされた。TEST_DATABASE_URL を確かめる" >&2
            exit 1
          fi

  admin:
    name: Access admin (Django) tests and image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ops/access_admin（ロール別の資料グループの管理画面。docs/access-admin.md）。テストは、chatbot / auth の身代わりと
    # supabase/migrations の実際の SQL を入れた使い捨ての DB を作るので、スーパーユーザーで接続できる Postgres が要る。
    # テスト専用のダミーの認証情報で、秘密情報は入っていない。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ADMIN_TEST_DB_HOST: 127.0.0.1
      ADMIN_TEST_DB_PORT: "5432"
      ADMIN_TEST_DB_USER: postgres
      ADMIN_TEST_DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: ops/access_admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Dockerfile のベースイメージ（python:3.12-slim）と、依存を固定した版にそろえる
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/access_admin/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # chatbot の表を写すモデルは managed = False。モデルを変えたのに migration が無い状態を、ここで落とす
      - name: Models match migrations (makemigrations --check)
        run: python manage.py makemigrations --check --dry-run
      - name: Django system check
        run: python manage.py check
      # 権限のテスト（access_admin の権限が、承認した最小の集合であること）、TOTP の関門、割り当ての安全装置を含む
      - name: Run Django tests
        run: python manage.py test --noinput
      # ここから Docker。ビルドの文脈は ops/access_admin（アプリ本体の app/ は使わない）
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the admin image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ops/access_admin
          push: false
          load: true
          tags: docunavi-admin:ci
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      # DB には接続しない（ダミーの URL）。起動時の設定検査（manage.py check）が通り、/healthz が応えて、
      # DB が無いときに /readyz が 503 の固定文（接続先やパスワードを含まない）を返すことを確かめる。
      - name: Start the image and check /healthz and /readyz
        run: |
          docker run -d --name docunavi-admin -p 8080:8080 \
            -e ADMIN_SECRET_KEY=ci-only-ci-only-ci-only-ci-only-ci-only \
            -e ADMIN_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e ADMIN_DATABASE_URL=postgresql://nobody:CI-DUMMY-PASSWORD@127.0.0.1:1/postgres \
            docunavi-admin:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > healthz.txt 2>/dev/null; then break; fi
            sleep 1
          done
          grep -qx ok healthz.txt
          code=$(curl -s -o readyz.json -w '%{http_code}' http://127.0.0.1:8080/readyz)
          cat readyz.json
          test "$code" = 503
          grep -q '"status": *"unavailable"' readyz.json
          if grep -qi 'CI-DUMMY-PASSWORD' readyz.json; then echo "readyz の応答にパスワードが出ている" >&2; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin/)
          test "$code" = 302
      - name: Show container logs on failure
        if: failure()
        run: docker logs docunavi-admin
        working-directory: .

  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lint.txt
      # ツールは、ハッシュ付きの固定（requirements-lint.txt）から入れる。アプリの依存とは別
      - name: Install the linters
        run: pip install --require-hashes -r requirements-lint.txt
      # 式の誤り・存在しないキー・run の中のシェルの問題など、構文と型の検査
      - name: actionlint
        run: actionlint
      # セキュリティの検査（権限・テンプレート注入・SHA 固定の偽装など）。GH_TOKEN は、固定した SHA が
      # 本物のリポジトリの履歴にあるか、既知の脆弱なアクションでないかを、GitHub に問い合わせるためだけに使う
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .

  frontend:
    name: Frontend (Next.js) tests, type-check and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: docunavi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # キーを渡さないので、アプリはモックモードで起動する。固定した依存で実際に動くことと、
      # /health と /chat が、イメージの中で応答することを確かめる（画面は Vercel の frontend が配信する）。
      - name: Start the image and check it responds
        run: |
          docker run -d --name docunavi -p 8000:8000 docunavi:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > health.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"status": *"ok"' health.json
          curl -fsS -X POST http://127.0.0.1:8000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message": "ザーハードの大気について教えて"}' > chat.json
          grep -q '"reply"' chat.json
      - name: Show container logs on failure
        if: failure()
        run: docker logs docunavi
